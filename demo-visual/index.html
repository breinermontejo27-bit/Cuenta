<title>Orisma 2.0 · Propuesta visual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concepto: Orisma tal cual (azul #1E4FA0, fuentes del sistema), con más jerarquía:
   un panel de inicio, 5 destinos en la barra, filas de una sola estructura y facturas como hoja real. */
:root {
  --marca: #1E4FA0; --marca-fuerte: #173F82; --marca-suave: #E8EFFA; --sobre-marca: #FFFFFF;
  --fondo: #F3F5F8; --superficie: #FFFFFF; --superficie-2: #EEF1F5; --borde: #E1E5EB; --borde-fuerte: #C9CFD8;
  --texto: #131821; --texto-2: #4A5261; --texto-3: #667080;
  --positivo: #12733F; --positivo-suave: #E4F3EA; --negativo: #B42318; --negativo-suave: #FCEBE9; --aviso: #8A5600; --aviso-suave: #FFF3D6;
  --demo: #5B3FA6; --demo-suave: #EFEAFB;
  --papel: #FFFFFF; --tinta: #111827; --tinta-2: #4B5563; --linea-papel: #D5DAE1;
  --fuente: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --sombra: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05); --sombra-2: 0 10px 30px rgba(16,24,40,.16);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --marca: #86ABEF; --marca-fuerte: #A9C4F5; --marca-suave: #19284A; --sobre-marca: #0A1830;
  --fondo: #0C0F14; --superficie: #151A21; --superficie-2: #1C222B; --borde: #262D38; --borde-fuerte: #3A4250;
  --texto: #E8EBF1; --texto-2: #AAB2BF; --texto-3: #8D96A5;
  --positivo: #55C690; --positivo-suave: #10281C; --negativo: #F27B6F; --negativo-suave: #3A1714; --aviso: #E7B74E; --aviso-suave: #322406;
  --demo: #B9A4F2; --demo-suave: #251C3D; --sombra: none; --sombra-2: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --marca: #86ABEF; --marca-fuerte: #A9C4F5; --marca-suave: #19284A; --sobre-marca: #0A1830;
  --fondo: #0C0F14; --superficie: #151A21; --superficie-2: #1C222B; --borde: #262D38; --borde-fuerte: #3A4250;
  --texto: #E8EBF1; --texto-2: #AAB2BF; --texto-3: #8D96A5;
  --positivo: #55C690; --positivo-suave: #10281C; --negativo: #F27B6F; --negativo-suave: #3A1714; --aviso: #E7B74E; --aviso-suave: #322406;
  --demo: #B9A4F2; --demo-suave: #251C3D; --sombra: none; --sombra-2: 0 10px 30px rgba(0,0,0,.5); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.45 var(--fuente); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--marca); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Franja de demostración ---------- */
.demo-banda { display: flex; align-items: center; gap: 10px; background: var(--demo-suave); color: var(--demo); font-size: 13px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.demo-banda strong { font-weight: 700; }
.demo-banda span { flex: 1; min-width: 0; color: var(--texto-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.demo-banda button { border: 1px solid var(--demo); background: transparent; color: var(--demo); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }

/* ---------- Marco de la app ---------- */
.marco { display: flex; min-height: calc(100% - 37px); }
.lateral { display: none; }
.principal { flex: 1; min-width: 0; padding-bottom: 96px; }
.cabecera { padding-block: 18px 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cabecera-fila { display: flex; align-items: flex-start; gap: 12px; }
.cabecera h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -.01em; font-weight: 700; text-wrap: balance; }
.cabecera p { margin: 4px 0 0; color: var(--texto-3); font-size: 14px; }
.cabecera .atras { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--borde); background: var(--superficie); display: grid; place-items: center; flex: none; }
.cabecera-titulo { flex: 1; min-width: 0; }
.avatar-negocio { width: 40px; height: 40px; border-radius: 12px; background: var(--marca); color: var(--sobre-marca); display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
.contenido { display: grid; gap: 14px; padding-block: 10px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Barra inferior: 5 destinos */
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--superficie); border-top: 1px solid var(--borde); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.barra a { display: grid; justify-items: center; gap: 3px; padding: 8px 2px 9px; font-size: 11.5px; font-weight: 600; color: var(--texto-3); text-decoration: none; }
.barra a .ico { width: 44px; height: 28px; border-radius: 999px; display: grid; place-items: center; }
.barra a[aria-current="page"] { color: var(--marca); }
.barra a[aria-current="page"] .ico { background: var(--marca-suave); }
.fab { position: fixed; z-index: 31; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: inline-flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px 0 16px; border: 0; border-radius: 16px; background: var(--marca); color: var(--sobre-marca); font-weight: 650; box-shadow: var(--sombra-2); }
.fab[hidden] { display: none; }

svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s { width: 18px; height: 18px; }

/* ---------- Piezas ---------- */
.buscador { display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 14px; background: var(--superficie); border: 1px solid var(--borde); border-radius: 14px; color: var(--texto-3); }
.buscador input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--texto); outline: none; }
.segmentos { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--superficie-2); border-radius: 12px; padding: 3px; gap: 3px; }
.segmentos button { border: 0; background: transparent; border-radius: 9px; padding: 8px 4px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; color: var(--texto-2); }
.segmentos button[aria-pressed="true"] { background: var(--superficie); color: var(--texto); box-shadow: var(--sombra); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.chip { border: 1px solid var(--borde-fuerte); background: var(--superficie); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 600; white-space: nowrap; color: var(--texto-2); }
.chip[aria-pressed="true"] { background: var(--texto); border-color: var(--texto); color: var(--fondo); }

.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-md); }
.tarjeta.p { padding: 16px; }
.seccion-titulo { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 2px -4px; }
.seccion-titulo h2 { margin: 0; font-size: 17px; font-weight: 700; }
.seccion-titulo a, .enlace { color: var(--marca); font-size: 14px; font-weight: 600; text-decoration: none; background: none; border: 0; padding: 0; }
.etiqueta { font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--texto-3); }

/* Filas: una sola estructura para todas las listas */
.lista { list-style: none; margin: 0; padding: 0; }
.lista > li + li { border-top: 1px solid var(--borde); }
.fila { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; background: none; border: 0; text-align: left; text-decoration: none; }
.fila-med { min-width: 0; }
.fila-t { display: block; font-weight: 650; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fila-s { display: block; font-size: 13.5px; color: var(--texto-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.fila-d { display: grid; justify-items: end; gap: 4px; text-align: right; }
.fila-v { font-weight: 700; font-size: 15.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mini { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: var(--superficie-2); color: var(--texto-2); flex: none; overflow: hidden; }
.mini.marca { background: var(--marca-suave); color: var(--marca); }
.mini.neg { background: var(--negativo-suave); color: var(--negativo); }
.mini.pos { background: var(--positivo-suave); color: var(--positivo); }
.mini.av { background: var(--aviso-suave); color: var(--aviso); }
.mini.foto { background: linear-gradient(135deg, var(--marca-suave), var(--superficie-2)); color: var(--marca); }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.pill.neg { background: var(--negativo-suave); color: var(--negativo); }
.pill.pos { background: var(--positivo-suave); color: var(--positivo); }
.pill.av { background: var(--aviso-suave); color: var(--aviso); }
.pill.neu { background: var(--superficie-2); color: var(--texto-2); }
.pill.mar { background: var(--marca-suave); color: var(--marca); }
.grupo { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 4px 6px; }
.grupo .etiqueta + span { font-size: 13px; color: var(--texto-3); }

/* Cifras */
.destacada { background: var(--marca); color: var(--sobre-marca); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 14px; }
.destacada .etq { font-size: 13.5px; opacity: .85; }
.destacada .cifra { font-size: 32px; font-weight: 750; letter-spacing: -.01em; line-height: 1.1; }
.destacada .pie { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.destacada .pie div { background: rgba(255,255,255,.12); border-radius: 12px; padding: 10px 12px; }
:root[data-theme="dark"] .destacada .pie div { background: rgba(0,0,0,.12); }
.destacada .pie b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
.destacada .pie small { font-size: 12.5px; opacity: .85; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-md); padding: 14px; display: grid; gap: 6px; text-decoration: none; }
.kpi .t { font-size: 13px; color: var(--texto-3); display: flex; align-items: center; gap: 6px; }
.kpi .v { font-size: clamp(16px, 4.4vw, 20px); font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi .s { font-size: 12.5px; color: var(--texto-3); }
.neg-t { color: var(--negativo); } .pos-t { color: var(--positivo); } .av-t { color: var(--aviso); }
.accesos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.acceso { display: grid; justify-items: center; gap: 6px; padding: 12px 4px; background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-md); font-size: 12.5px; font-weight: 600; color: var(--texto-2); text-align: center; text-decoration: none; }
.acceso .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--marca-suave); color: var(--marca); }
.lineas { display: grid; }
.linea { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--borde); font-size: 14.5px; }
.linea:first-child { border-top: 0; }
.linea dt { color: var(--texto-2); } .linea dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.linea.total dt, .linea.total dd { color: var(--texto); font-weight: 750; font-size: 16px; }
.barras { display: grid; grid-template-columns: repeat(6, 1fr); align-items: end; gap: 10px; height: 130px; padding-top: 8px; }
.barras div { display: grid; gap: 6px; justify-items: center; height: 100%; align-content: end; }
.barras i { display: block; width: 100%; max-width: 34px; border-radius: 7px 7px 3px 3px; background: var(--marca-suave); }
.barras div:last-child i { background: var(--marca); }
.barras small { font-size: 11.5px; color: var(--texto-3); }
.aviso-caja { display: flex; gap: 10px; align-items: flex-start; background: var(--aviso-suave); color: var(--aviso); border-radius: var(--r-md); padding: 12px 14px; font-size: 14px; }
.aviso-caja b { color: inherit; }
.nota { font-size: 13px; color: var(--texto-3); margin: 0; }
.acciones-fila { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--borde-fuerte); background: var(--superficie); font-weight: 650; text-decoration: none; }
.btn.prim { background: var(--marca); border-color: var(--marca); color: var(--sobre-marca); }
.btn.peligro { color: var(--negativo); border-color: var(--borde-fuerte); }
.btn.peq { min-height: 40px; font-size: 14px; padding: 0 12px; }
.btn.bloque { width: 100%; }

/* ---------- Hojas y diálogos ---------- */
.velo { position: fixed; inset: 0; z-index: 60; background: rgba(8, 12, 20, .45); display: flex; align-items: flex-end; justify-content: center; }
.velo[hidden] { display: none; }
.hoja { width: 100%; max-width: 560px; max-height: 92%; overflow: auto; background: var(--superficie); border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
.hoja-cab { position: sticky; top: 0; z-index: 1; background: var(--superficie); padding: 8px 16px 12px; border-bottom: 1px solid var(--borde); }
.agarre { width: 40px; height: 5px; border-radius: 99px; background: var(--borde-fuerte); margin: 2px auto 10px; }
.hoja-cab .fila-c { display: flex; align-items: center; gap: 10px; }
.hoja-cab h2 { margin: 0; font-size: 19px; flex: 1; }
.hoja-cab p { margin: 2px 0 0; font-size: 13px; color: var(--texto-3); }
.cerrar { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--borde); background: var(--superficie); display: grid; place-items: center; }
.pasos { display: flex; gap: 6px; margin-top: 10px; }
.pasos i { flex: 1; height: 4px; border-radius: 9px; background: var(--borde); }
.pasos i.on { background: var(--marca); }
.hoja-cuerpo { padding: 16px; display: grid; gap: 16px; }
.hoja-pie { position: sticky; bottom: 0; background: var(--superficie); border-top: 1px solid var(--borde); padding: 12px 16px; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.campo { display: grid; gap: 6px; }
.campo label, .campo .lbl { font-size: 13.5px; font-weight: 650; color: var(--texto-2); }
.control { width: 100%; min-height: 48px; border: 1px solid var(--borde-fuerte); border-radius: 12px; background: var(--superficie); color: var(--texto); font: inherit; padding: 0 14px; }
.control.dinero-c { display: flex; align-items: center; gap: 6px; padding: 0 14px; }
.control.dinero-c span { color: var(--texto-3); font-weight: 600; }
.control.dinero-c input { flex: 1; min-width: 0; width: 100%; border: 0; background: transparent; font: inherit; color: var(--texto); text-align: right; font-variant-numeric: tabular-nums; outline: none; font-weight: 650; }
.ayuda { font-size: 12.5px; color: var(--texto-3); }
.error { font-size: 12.5px; color: var(--negativo); font-weight: 600; }
.control.mal { border-color: var(--negativo); }
.dos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.dos > *, .campo, .kpi, .segmentos button { min-width: 0; }
.item-c { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px 0; border-top: 1px solid var(--borde); }
.item-c:first-child { border-top: 0; padding-top: 0; }
.cant { display: inline-flex; align-items: center; border: 1px solid var(--borde-fuerte); border-radius: 10px; overflow: hidden; }
.cant button { width: 36px; height: 34px; border: 0; background: var(--superficie-2); font-size: 18px; }
.cant span { min-width: 34px; text-align: center; font-weight: 700; }
.totales-c { background: var(--superficie-2); border-radius: 14px; padding: 4px 14px; }
.dialogo { width: min(92%, 400px); align-self: center; background: var(--superficie); border-radius: 20px; padding: 20px; display: grid; gap: 12px; box-shadow: var(--sombra-2); }
.dialogo h2 { margin: 0; font-size: 19px; }
.dialogo p { margin: 0; color: var(--texto-2); }
.dialogo .bot { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(148px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--texto); color: var(--fondo); border-radius: 14px; padding: 11px 16px; font-size: 14px; font-weight: 600; box-shadow: var(--sombra-2); display: flex; gap: 8px; align-items: center; max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
.mas-rejilla { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.guia li { padding: 10px 0; border-top: 1px solid var(--borde); }
.guia li:first-child { border-top: 0; }
.guia a { font-weight: 650; color: var(--marca); text-decoration: none; }
.guia p { margin: 2px 0 0; font-size: 13.5px; color: var(--texto-2); }

/* ---------- Factura como hoja real ---------- */
.factura-marco { display: grid; gap: 12px; }
.visor { background: var(--superficie-2); border: 1px solid var(--borde); border-radius: var(--r-md); padding: 12px; overflow: hidden; }
.visor.ampliado { overflow-x: auto; }
.escala { transform-origin: top left; }
.papel { width: 720px; min-height: 1018px; background: var(--papel); color: var(--tinta); padding: 44px 46px; font: 13px/1.45 var(--fuente); box-shadow: 0 2px 10px rgba(16,24,40,.12); color-scheme: light; }
.papel .num { font-variant-numeric: tabular-nums; }

/* Propuesta A · Fiel a la original */
.fa .cab { display: flex; gap: 14px; align-items: center; padding-bottom: 14px; border-bottom: 2px solid var(--tinta); }
.fa .logo { width: 58px; height: 58px; border-radius: 10px; background: var(--fc); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 20px; flex: none; }
.fa .neg-n { font-size: 20px; font-weight: 800; }
.fa .neg-m { font-size: 12px; color: var(--tinta-2); line-height: 1.5; }
.fa .titulo { text-align: center; font-size: 30px; font-weight: 800; letter-spacing: .04em; margin: 22px 0 16px; }
.fa .meta { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
.fa .p-lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8A93A3; margin-bottom: 3px; }
.fa .p-n { font-size: 15px; font-weight: 700; }
.fa .p-m { font-size: 12px; color: var(--tinta-2); line-height: 1.5; }
.fa .nro { text-align: right; }
.fa .nro b { display: block; font-size: 22px; color: var(--fc); }
.fa .nro .f { color: var(--fc); font-size: 13.5px; }
.fa .nro .fp { color: var(--tinta-2); font-size: 12.5px; margin-top: 2px; }
.fa table { width: 100%; border-collapse: collapse; margin-top: 18px; }
.fa thead th { background: var(--fc); color: #fff; font-size: 12px; font-weight: 600; padding: 8px 10px; text-align: left; }
.fa th.n, .fa td.n { text-align: right; white-space: nowrap; }
.fa tbody td { padding: 9px 10px; border-bottom: 1px solid var(--linea-papel); vertical-align: top; }
.fa .it-n { font-weight: 700; }
.fa .it-s { font-size: 11.5px; color: var(--tinta-2); margin-top: 2px; }
.fa .abajo { display: grid; grid-template-columns: 1fr 44%; gap: 22px; margin-top: 14px; align-items: start; }
.fa .tenga { border-top: 1px solid var(--fc); padding-top: 7px; font-size: 12px; }

        <div class="campo"><label for="c2">Teléfono</label><input class="control" id="c2" inputmode="tel" placeholder="Opcional"><span class="ayuda">Para enviarle recordatorios por WhatsApp.</span></div>
        <div class="campo"><label for="c3">Correo</label><input class="control" id="c3" inputmode="email" placeholder="Opcional"></div>
        <div class="campo"><label for="c4">Dirección de facturación</label><textarea class="control" id="c4" rows="2" style="padding-top:12px" placeholder="Opcional"></textarea></div>
      </div>
      <div class="hoja-pie"><button class="btn" type="button" data-cerrar>Cancelar</button><button class="btn prim" type="button" data-cerrar data-toast="Cliente registrado">Guardar</button></div></div>`,
  };
  const hojaSimple = (t, sub, cuerpo) => () => `<div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hs"><div class="hoja-cab"><div class="agarre"></div><div class="fila-c"><h2 id="hs">${t}</h2><button class="cerrar" type="button" data-cerrar aria-label="Cerrar">${ico('cerrar', 's')}</button></div><p>${sub}</p></div><div class="hoja-cuerpo">${cuerpo}</div><div class="hoja-pie"><button class="btn" type="button" data-cerrar>Volver</button><button class="btn prim" type="button" data-cerrar data-toast="Ajustes guardados">Guardar</button></div></div>`;
  const campoD = (id, l, v, extra = '') => `<div class="campo"><label for="${id}">${l}</label><input class="control" id="${id}" value="${v}" ${extra}></div>`;
  Object.assign(hojas, {
    'aj-negocio': hojaSimple('Negocio', 'Tu foto de perfil y los datos de tu negocio.', `<div style="display:flex;gap:12px;align-items:center"><span class="avatar-negocio" style="width:56px;height:56px">OA</span><div class="dos" style="flex:1"><button class="btn peq" type="button">Foto de perfil</button><button class="btn peq" type="button">Logo</button></div></div>${campoD('n1', 'Nombre del negocio', 'Orisma Accesorios')}${campoD('n2', 'Dirección', 'Cra 7 # 45-12, Bogotá')}<div class="dos">${campoD('n3', 'Teléfono', '300 123 4567')}${campoD('n4', 'Correo', 'ventas@orisma.co')}</div>`),
    'aj-productos': hojaSimple('Productos', 'Valores que la app usa al crear y revisar tus productos.', `<div class="dos">${campoD('pr1', 'Ganancia por defecto (%)', '60')}${campoD('pr2', 'Poco stock desde', '3')}</div>`),
    'aj-moneda': hojaSimple('Moneda e impuestos', 'Se aplican a tus ventas y facturas.', `<div class="dos">${campoD('mo1', 'Símbolo de moneda', '$')}${campoD('mo2', 'Impuesto (%)', '0')}</div>`),
    'aj-pin': hojaSimple('Bloqueo con PIN', 'El PIN está desactivado.', `<p class="nota">El PIN evita que otra persona abra la app por casualidad en tu teléfono. Se pide al abrir la app y al volver después de 5 minutos.</p>${campoD('pin1', 'PIN', '', 'type="password" placeholder="4 a 8 números"')}${campoD('pin2', 'Repite el PIN', '', 'type="password"')}`),
    'aj-anterior': hojaSimple('Versión anterior', 'Datos traídos de la app "Cuentas"', `<div class="totales-c">${lineas([['Datos traídos el', '20 nov 2026, 9:12'], ['Clientes', '5'], ['Productos', '6'], ['Ventas', '6']])}</div><p class="nota">Los datos de la versión anterior no cambiaron desde que se trajeron. Siguen guardados en este navegador: Orisma nunca los borra.</p>`),
  });
  const dialogos = {
    anular: ['¿Anular esta venta?', 'Las unidades vuelven al inventario. Esta acción no se puede deshacer.', 'Anular venta'],
    eliminar: ['¿Eliminar este producto?', 'Sus ventas se conservan. Esta acción no se puede deshacer.', 'Eliminar'],
    liquidar: ['¿Liquidar toda la deuda?', `Se registrará un abono de ${dinero(120000)} para cerrar sus ventas a crédito.`, 'Liquidar'],
  };
  const abrirDialogo = (k) => { const [t, m, a] = dialogos[k]; velo.innerHTML = `<div class="dialogo" role="alertdialog" aria-modal="true" aria-labelledby="dt"><h2 id="dt">${t}</h2><p>${m}</p><div class="bot"><button class="btn" type="button" data-cerrar>Cancelar</button><button class="btn prim" type="button" data-cerrar data-toast="Hecho" style="background:var(--negativo);border-color:var(--negativo)">${a}</button></div></div>`; velo.hidden = false; velo.querySelector('[data-cerrar]').focus(); };
  const abrirHoja = (k) => { velo.innerHTML = hojas[k](); velo.hidden = false; };
  let reloj;
  const aviso = (t) => { const el = $('#toast'); el.innerHTML = `${ico('ok', 's')}${t}`; el.hidden = false; clearTimeout(reloj); reloj = setTimeout(() => { el.hidden = true; }, 2200); };
  const GUIA = [
    ['inicio', 'Inicio (nuevo)', 'Estilo 1: resumen en tarjetas y accesos rápidos. Estilo 2: la cifra del día y "Necesita atención".'],
    ['ventas', 'Ventas', 'Agrupadas por día con su total; pendientes en la otra pestaña.'],
    ['venta', 'Detalle de venta', 'Total, cuánto se ha pagado y acciones a mano.'],
    ['inventario', 'Inventario', 'Stock como etiqueta de color; filtros por categoría.'],
    ['producto', 'Detalle de producto', 'Cifras clave arriba, historial de compras abajo.'],
    ['clientes', 'Clientes', 'Total por cobrar y quién debe, a primera vista.'],
    ['cliente', 'Detalle de cliente', 'Deuda, abonar, WhatsApp y créditos.'],
    ['gastos', 'Gastos', 'Total del mes y gastos agrupados por mes.'],
    ['reportes', 'Reportes', 'Ganancia destacada, cifras y últimos 6 meses.'],
    ['mas', 'Menú "Más"', 'Facturas, Gastos, Reportes, Créditos y Ajustes.'],
    ['formulario', 'Formularios y ventanas', 'Campos, selectores, hojas y confirmaciones.'],
    ['ajustes', 'Ajustes', 'Todas las secciones de hoy: Negocio, Créditos, Factura, Productos, Moneda, Respaldo, PIN y Versión anterior.'],
    ['ajustes-respaldo', 'Ajustes › Respaldo', 'Descargar y restaurar tus datos.'],
    ['donde', '¿Dónde está cada función?', 'Mapa de tu app original al diseño nuevo.'],
    ['factura-original', 'Factura (propuesta A, elegida)', 'Fiel a tu factura original, como hoja de papel.'],
  ];
  $('#abrirGuia').addEventListener('click', () => {
    velo.innerHTML = `<div class="hoja" role="dialog" aria-modal="true" aria-labelledby="hg"><div class="hoja-cab"><div class="agarre"></div><div class="fila-c"><h2 id="hg">Pantallas de la demostración</h2><button class="cerrar" type="button" data-cerrar aria-label="Cerrar">${ico('cerrar', 's')}</button></div><p>También puedes navegar con la barra de abajo, como en la app.</p></div><div class="hoja-cuerpo"><ol class="lista guia">${GUIA.map(([h, t, d]) => `<li><a href="#${h}" data-cerrar>${t}</a><p>${d}</p></li>`).join('')}</ol></div></div>`;
    velo.hidden = false;
  });

  // ---------- Pintar ----------
  const escalar = () => {
    const v = $('#visor'), e = $('#escala');
    if (!v || !e) return;
    const papel = e.firstElementChild;
    if (estado.ampliar) { e.style.transform = 'none'; v.style.height = 'auto'; return; }
    const k = Math.min(1, (v.clientWidth - 24) / papel.offsetWidth);
    e.style.transform = `scale(${k})`;
    v.style.height = `${papel.offsetHeight * k + 24}px`;
  };
  addEventListener('resize', escalar);

  const pintar = () => {
    let r = (location.hash || '#inicio').slice(1);
    if (!P_[r]) r = 'inicio';
    if (r === 'ventas' && estado.ventasVista === 'pendientes' && !window.__desdePend) estado.ventasVista = 'ventas';
    window.__desdePend = false;
    const s = P_[r]();
    const activo = PADRE[r] || r;
    const actLat = { venta: 'ventas', pendientes: 'ventas', producto: 'inventario', cliente: 'clientes', 'factura-original': 'facturas', 'factura-refinada': 'facturas', formulario: 'inicio' }[r] || r;
    document.documentElement.dataset.estilo = estado.estilo;
    document.querySelectorAll('[data-estilo]').forEach((b) => { if (b.tagName === 'BUTTON') b.setAttribute('aria-pressed', String(b.dataset.estilo === estado.estilo)); });
    const barra = e2() ? [['inicio', 'Inicio'], ['ventas', 'Ventas'], ['formulario', 'Vender', 'central'], ['inventario', 'Inventario'], ['clientes', 'Clientes']] : BARRA;
    $('#barra').innerHTML = barra.map(([h, t, c]) => `<a href="#${h}" ${c ? `class="${c}" data-vender` : ''} ${h === activo && !c ? 'aria-current="page"' : ''}><span class="ico">${ico(c ? 'mas2' : h)}</span>${t}</a>`).join('');
    $('#lateral').innerHTML = `<div class="neg"><span class="avatar-negocio">OA</span>Orisma Accesorios</div>${LATERAL.map(([g, l]) => `${g ? `<div class="grupo-l">${g}</div>` : ''}${l.map(([h, t, i]) => `<a href="#${h}" ${h === actLat ? 'aria-current="page"' : ''}>${ico(i)}${t}</a>`).join('')}`).join('')}<div class="abajo-l"><a href="#ajustes" ${['ajustes', 'ajustes-respaldo', 'ajustes-factura'].includes(r) ? 'aria-current="page"' : ''}>${ico('ajustes')}Ajustes</a><a href="#donde" ${r === 'donde' ? 'aria-current="page"' : ''}>${ico('buscar')}¿Dónde está cada función?</a></div>`;
    const derecha = e2()
      ? `${s.fab ? `<a class="btn prim fab-sitio" href="#${s.fab[1]}">${ico('mas2', 's')}${s.fab[0]}</a>` : ''}${!s.volver ? '<a class="mas-boton" href="#mas" aria-label="Más: facturas, gastos, reportes y ajustes">OA</a>' : ''}`
      : `${s.fab ? `<a class="btn prim fab-sitio" href="#${s.fab[1]}">${ico('mas2', 's')}${s.fab[0]}</a>` : ''}${!s.volver ? `<a class="engranaje" href="#ajustes" aria-label="Ajustes">${ico('ajustes', 's')}</a>` : ''}`;
    $('#cabecera').innerHTML = `<div class="cabecera-fila">${s.volver ? `<a class="atras" href="#${s.volver}" aria-label="Volver">${ico('atras')}</a>` : ''}${s.avatar && !e2() ? '<span class="avatar-negocio">OA</span>' : ''}<div class="cabecera-titulo"><h1>${s.titulo}</h1>${s.sub ? `<p>${s.sub}</p>` : ''}</div>${derecha}</div>`;
    $('#contenido').innerHTML = s.html;
    const fab = $('#fab');
    fab.hidden = !s.fab || matchMedia('(min-width: 900px)').matches;
    if (s.fab) { fab.innerHTML = `${ico('mas2')}${s.fab[0]}`; fab.onclick = () => { if (s.fab[1] === 'formulario') abrirHoja(r === 'clientes' ? 'cliente' : 'venta'); else location.hash = s.fab[1]; }; }
    requestAnimationFrame(escalar);
  };

  document.addEventListener('click', (e) => {
    const b = e.target.closest('button, a');
    if (!b) return;
    if (b.tagName === 'BUTTON' && b.dataset.estilo) { estado.estilo = b.dataset.estilo; try { localStorage.setItem('orisma-demo-estilo', estado.estilo); } catch (_) { /* sin almacenamiento */ } pintar(); return; }
    if (b.dataset.vender !== undefined) { e.preventDefault(); abrirHoja('venta'); return; }
    if (b.dataset.toast) aviso(b.dataset.toast);
    if (b.dataset.dialogo) abrirDialogo(b.dataset.dialogo);
    if (b.dataset.hoja) abrirHoja(b.dataset.hoja);
    if (b.dataset.cat !== undefined) { estado.invCat = b.dataset.cat; pintar(); }
    if (b.dataset.per) { estado.repPeriodo = b.dataset.per; pintar(); }
    if (b.id === 'ampliar') { estado.ampliar = !estado.ampliar; pintar(); }
    if (b.dataset.seg) {
      const g = b.parentElement;
      g.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      if (['ventas', 'pendientes'].includes(b.dataset.seg) && $('#contenido').contains(b)) { estado.ventasVista = b.dataset.seg; window.__desdePend = true; pintar(); }
      if (['credito', 'pagada'].includes(b.dataset.seg)) { estado.facturaEj = b.dataset.seg; pintar(); }
    }
    if (b.matches('a[href="#pendientes"]')) { estado.ventasVista = 'pendientes'; window.__desdePend = true; }
  });
  addEventListener('hashchange', () => { cerrarVelo(); pintar(); scrollTo(0, 0); });
  pintar();
})();
</script>
