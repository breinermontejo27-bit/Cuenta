  // ============================================================
  // INVENTARIO form
  // ============================================================
  function openProductoForm(id){
    const record = id ? inventario.find(p => p.id === id) : null;
    const compras = record ? gastos.filter(g => g.tipo === 'compra' && g.productoId === record.id).sort((a,b) => b.fecha.localeCompare(a.fecha)) : [];
    const unidCompradas = compras.reduce((s,g) => s + (Number(g.cantidad)||0), 0);
    const invertido = compras.reduce((s,g) => s + (Number(g.monto)||0), 0);
    const unidVendidas = record ? ventas.reduce((s,v) => s + (v.items||[]).filter(it => it.productoId === record.id).reduce((a,it) => a + (Number(it.cantidad)||0), 0), 0) : 0;
    const historialHtml = record ? `
      <div class="section-label" style="margin-top:6px;">Historial de compras</div>
      ${compras.length ? `
        <div class="rep-card">
          <div class="rep-line strong"><span>Unidades compradas</span><span>${unidCompradas}</span></div>
          <div class="rep-line"><span>Total invertido</span><span>${money(invertido)}</span></div>
          <div class="rep-line"><span>Costo promedio por unidad</span><span>${money(unidCompradas ? invertido / unidCompradas : 0)}</span></div>
          <div class="rep-line"><span>Unidades vendidas</span><span>${unidVendidas}</span></div>
        </div>
        <div class="rep-card" style="margin-top:10px;">
          ${compras.map(g => `
            <div class="rep-line">
              <span><span class="credit-title" style="display:block;">${fmtDate(g.fecha)} · ${g.cantidad} unid.</span><span class="credit-sub" style="display:block;">${money(g.cantidad ? g.monto / g.cantidad : 0)} por unidad</span></span>
              <span>${money(g.monto)}</span>
            </div>`).join('')}
        </div>` : `<div class="step-note">Aún no hay compras registradas para este producto. Usa "Registrar compra" para agregarlas.</div>`}
    ` : '';
    openOverlay(`
      <div class="sheet-handle"></div>
      <h2>${record ? 'Editar' : 'Nuevo'} producto</h2>
      <div class="field"><label>Nombre del producto</label><input type="text" id="f_nombre" value="${escapeHtml(record ? record.nombre : '')}" placeholder="Nombre"></div>
      ${imagePickerHtml('pfoto', 'Foto del producto (opcional)', record && record.foto ? record.foto : '', 'Sin foto')}
      <div class="field">
        <label>Categoría (opcional)</label>
        <input type="text" id="f_categoria" list="catList" value="${escapeHtml(record ? (record.categoria||'') : '')}" placeholder="Ej. Bebidas, Ropa, Accesorios">
        <datalist id="catList">${getCategorias().map(c => `<option value="${escapeHtml(c)}">`).join('')}</datalist>
      </div>
      <div class="field">
        <label>Descripción para la factura (opcional)</label>
        <textarea id="f_descripcion" rows="2" placeholder="Ej. Balines #4 en oro 18k, nacional, diamantado">${escapeHtml(record ? (record.descripcion||'') : '')}</textarea>
      </div>
      <div class="row2">
        <div class="field mono"><label>Costo (${config.moneda})</label><input type="number" inputmode="decimal" id="f_costo" value="${record && record.costo ? record.costo : ''}" placeholder="¿Cuánto te cuesta?"></div>
        <div class="field mono"><label>Ganancia deseada (%)</label><input type="number" inputmode="decimal" id="f_margen" value="${record ? (record.margen || '') : (config.margenDefault || '')}" placeholder="Ej. 40"></div>
      </div>
      <div class="row2">
        <div class="field mono"><label>Precio de venta (${config.moneda})</label><input type="number" inputmode="decimal" id="f_precio" value="${record ? record.precio : ''}" placeholder="0.00"></div>
        <div class="field mono"><label>Stock (opcional)</label><input type="number" inputmode="numeric" id="f_stock" value="${record && record.stock !== '' ? record.stock : ''}" placeholder="—"></div>
      </div>
      <div class="step-note" id="gananciaPreview" style="margin-top:-6px;"></div>
      <div class="row2">
        <div class="field mono"><label>Avisar si baja de (unid.)</label><input type="number" inputmode="numeric" id="f_umbral" value="${record && record.stockMinimo !== undefined && record.stockMinimo !== '' && record.stockMinimo !== null ? record.stockMinimo : ''}" placeholder="${config.stockMinimo}"></div>
      </div>
      <div class="step-note" style="margin-top:-6px;">Déjalo vacío para usar el límite general (${config.stockMinimo} unid.).</div>
      ${toggleRowHtml('f_sinAlerta', 'No avisar de poco stock para este producto', record && record.sinAlerta)}
      ${record ? `<div class="field" id="stockMotivoField" style="display:none;"><label>Motivo del ajuste de stock (opcional)</label><input type="text" id="f_stockMotivo" placeholder="Ej. producto dañado, conteo físico, devolución"></div>` : ''}
      ${record ? `<button class="link-btn" id="compraBtn" style="display:block; margin:4px 0 16px;">📦 Registrar compra (reabastecer stock)</button>` : ''}
      ${historialHtml}
      <div class="sheet-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveBtn">Guardar</button>
      </div>
      ${record ? '<button class="btn-danger-text" id="deleteBtn">Eliminar</button>' : ''}
      <div id="delConfirm"></div>
    `, (overlay) => {
      let foto = record && record.foto ? record.foto : '';
      wireImagePicker(overlay, 'pfoto', 'Sin foto', 300, (d) => { foto = d; });
      const costoInput = overlay.querySelector('#f_costo');
      const margenInput = overlay.querySelector('#f_margen');
      const precioInput = overlay.querySelector('#f_precio');
      const preview = overlay.querySelector('#gananciaPreview');
      let lastEdited = (!record && config.margenDefault) ? 'margen' : 'precio';

      function updatePreview(){
        const costo = Number(costoInput.value) || 0;
        const precio = Number(precioInput.value) || 0;
        if(costo > 0 && precio > 0){
          const ganancia = precio - costo;
          const pct = Math.round((ganancia / costo) * 100);
          preview.textContent = `Ganas ${money(ganancia)} por unidad (${pct}% sobre el costo)`;
        } else {
          preview.textContent = '';
        }
      }
      function recalc(source){
        const costo = Number(costoInput.value) || 0;
        if(source === 'costo' || source === 'margen'){
          const margen = Number(margenInput.value) || 0;
          if(costo > 0 && margen !== 0) precioInput.value = (costo * (1 + margen/100)).toFixed(2);
        } else if(source === 'precio'){
          const precio = Number(precioInput.value) || 0;
          if(costo > 0) margenInput.value = Math.round(((precio - costo) / costo) * 100);
        }
        updatePreview();
      }
      costoInput.addEventListener('input', () => recalc(lastEdited === 'precio' ? 'precio' : 'costo'));
      margenInput.addEventListener('input', () => { lastEdited = 'margen'; recalc('margen'); });
      precioInput.addEventListener('input', () => { lastEdited = 'precio'; recalc('precio'); });
      updatePreview();

      const stockInput = overlay.querySelector('#f_stock');
      const stockMotivoField = overlay.querySelector('#stockMotivoField');
      const stockOriginal = (record && record.stock !== '' && record.stock !== null) ? Number(record.stock) : null;
      function checkStockChanged(){
        if(!stockMotivoField) return;
        const val = stockInput.value === '' ? null : Number(stockInput.value);
        stockMotivoField.style.display = (val !== stockOriginal) ? 'block' : 'none';
      }
      if(stockInput) stockInput.addEventListener('input', checkStockChanged);
      checkStockChanged();

      overlay.querySelector('#cancelBtn').addEventListener('click', () => overlay.remove());
      const compraBtn = overlay.querySelector('#compraBtn');
      if(compraBtn) compraBtn.addEventListener('click', () => { overlay.remove(); openCompraForm(record.id); });
      overlay.querySelector('#saveBtn').addEventListener('click', () => {
        const nombre = overlay.querySelector('#f_nombre').value.trim();
        if(!nombre){ overlay.querySelector('#f_nombre').focus(); return; }
        const precioVal = precioInput.value;
        const stockVal = stockInput.value;
        const data = {
          id: record ? record.id : uid(),
          nombre,
          categoria: overlay.querySelector('#f_categoria').value.trim(),
          descripcion: overlay.querySelector('#f_descripcion').value.trim(),
          costo: costoInput.value === '' ? 0 : Number(costoInput.value),
          margen: margenInput.value === '' ? 0 : Number(margenInput.value),
          precio: precioVal === '' ? 0 : Number(precioVal),
          stock: stockVal === '' ? '' : Number(stockVal),
          foto,
          stockMinimo: overlay.querySelector('#f_umbral').value === '' ? '' : Number(overlay.querySelector('#f_umbral').value),
          sinAlerta: overlay.querySelector('#f_sinAlerta').checked,
        };
        if(record){
          const stockAnterior = stockOriginal === null ? 0 : stockOriginal;
          const stockNuevoVal = stockVal === '' ? 0 : Number(stockVal);
          if(stockAnterior !== stockNuevoVal){
            const motivoInput = overlay.querySelector('#f_stockMotivo');
            movimientos = [...movimientos, {
              id: uid(), tipo: 'ajuste', ts: Date.now(), productoId: data.id, productoNombre: nombre,
              stockAnterior, stockNuevo: stockNuevoVal,
              motivo: motivoInput ? motivoInput.value.trim() : '',
              fecha: todayStr(),
            }];
            save('cuentas_movimientos', movimientos);
          }
        }
        if(!record){
          movimientos = [...movimientos, { id: uid(), tipo: 'alta', ts: Date.now(), productoId: data.id, productoNombre: nombre, stockNuevo: data.stock === '' ? '' : data.stock, fecha: todayStr() }];
          save('cuentas_movimientos', movimientos);
        }
        inventario = record ? inventario.map(p => p.id === record.id ? data : p) : [...inventario, data];
        save('cuentas_inventario', inventario);
        overlay.remove();
        renderList();
      });
      const del = overlay.querySelector('#deleteBtn');
      if(del) del.addEventListener('click', () => {
        const confirmBox = overlay.querySelector('#delConfirm');
        confirmBox.innerHTML = `
          <div class="rep-card" style="margin-top:14px; padding:14px;">
            <p style="font-size:14px; line-height:1.5; margin-bottom:12px;">¿Seguro que quieres eliminar <strong>${escapeHtml(record.nombre)}</strong> del inventario? Esta acción no se puede deshacer.</p>
            <div class="sheet-actions" style="margin-top:0;">
              <button class="btn btn-secondary" id="delNo">No, cancelar</button>
              <button class="btn btn-primary" id="delSi" style="background:var(--danger);">Sí, eliminar</button>
            </div>
          </div>`;
        overlay.querySelector('#delNo').addEventListener('click', () => { confirmBox.innerHTML = ''; });
        overlay.querySelector('#delSi').addEventListener('click', () => {
          movimientos = [...movimientos, { id: uid(), tipo: 'baja', ts: Date.now(), productoId: record.id, productoNombre: record.nombre, stockAnterior: record.stock, fecha: todayStr() }];
          save('cuentas_movimientos', movimientos);
          inventario = inventario.filter(p => p.id !== record.id);
          save('cuentas_inventario', inventario);
          overlay.remove();
          renderList();
        });
      });
    });
  }

  function openCompraForm(productId){
    const p = inventario.find(x => x.id === productId);
    if(!p) return;
    const stockActual = (p.stock === '' || p.stock === null) ? 0 : Number(p.stock);
    const costoActual = Number(p.costo) || 0;
    openOverlay(`
      <div class="sheet-handle"></div>
      <h2>Registrar compra</h2>
      <div class="step-note">${escapeHtml(p.nombre)} · Stock actual: ${p.stock === '' || p.stock === null ? 'sin control' : stockActual + ' unid.'}${costoActual > 0 ? ' · Costo actual: ' + money(costoActual) : ''}</div>
      <div class="row2">
        <div class="field mono"><label>Cantidad comprada</label><input type="number" inputmode="numeric" id="c_cantidad" placeholder="Ej. 10"></div>
        <div class="field mono"><label>Costo unitario (${config.moneda})</label><input type="number" inputmode="decimal" id="c_costo" value="${costoActual || ''}" placeholder="0.00"></div>
      </div>
      <div class="field"><label>Fecha de la compra</label><input type="date" id="c_fecha" value="${todayStr()}"></div>
      <div class="step-note" id="promedioPreview" style="margin-top:-6px;"></div>
      <div class="row2">
        <div class="field mono"><label>Nuevo precio de venta (${config.moneda})</label><input type="number" inputmode="decimal" id="c_precioNuevo" value="${p.precio || ''}" placeholder="0.00"></div>
        <div class="field mono"><label>Ganancia (%)</label><input type="number" inputmode="decimal" id="c_margenNuevo" value="${p.margen || ''}" placeholder="Ej. 40"></div>
      </div>
      <div class="step-note" id="gananciaNuevaPreview" style="margin-top:-6px;"></div>
      <div class="sheet-actions">
        <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveCompraBtn">Registrar compra</button>
      </div>
    `, (overlay) => {
      const cantidadInput = overlay.querySelector('#c_cantidad');
      const costoInput = overlay.querySelector('#c_costo');
      const preview = overlay.querySelector('#promedioPreview');
      const precioNuevoInput = overlay.querySelector('#c_precioNuevo');
      const margenNuevoInput = overlay.querySelector('#c_margenNuevo');
      const gananciaNuevaPreview = overlay.querySelector('#gananciaNuevaPreview');
      let lastEditedPrecio = Number(p.margen) ? 'margen' : 'precio';

      function calcularNuevoCosto(cant, costoCompra){
        if(stockActual > 0 && costoActual > 0){
          return ((stockActual * costoActual) + (cant * costoCompra)) / (stockActual + cant);
        }
        return costoCompra || costoActual;
      }
      function updatePreview(){
        const cant = Number(cantidadInput.value) || 0;
        const costoCompra = Number(costoInput.value) || 0;
        if(cant > 0 && costoCompra > 0){
          const nuevoCosto = calcularNuevoCosto(cant, costoCompra);
          preview.textContent = (stockActual > 0 && costoActual > 0)
            ? `Nuevo costo promedio: ${money(nuevoCosto)} por unidad (antes ${money(costoActual)})`
            : `Costo por unidad: ${money(nuevoCosto)}`;
        } else {
          preview.textContent = '';
        }
      }
      function syncPrecioNuevo(){
        const cant = Number(cantidadInput.value) || 0;
        const costoCompra = Number(costoInput.value) || 0;
        const nuevoCosto = calcularNuevoCosto(cant, costoCompra);
        if(lastEditedPrecio === 'margen'){
          const margen = Number(margenNuevoInput.value) || 0;
          if(nuevoCosto > 0) precioNuevoInput.value = (nuevoCosto * (1 + margen/100)).toFixed(2);
        } else {
          const precio = Number(precioNuevoInput.value) || 0;
          if(nuevoCosto > 0) margenNuevoInput.value = Math.round(((precio - nuevoCosto) / nuevoCosto) * 100);
        }
        const precioFinal = Number(precioNuevoInput.value) || 0;
        if(nuevoCosto > 0 && precioFinal > 0){
          const ganancia = precioFinal - nuevoCosto;
          gananciaNuevaPreview.textContent = `Con este precio ganas ${money(ganancia)} por unidad`;
        } else {
          gananciaNuevaPreview.textContent = '';
        }
      }
      cantidadInput.addEventListener('input', () => { updatePreview(); syncPrecioNuevo(); });
      costoInput.addEventListener('input', () => { updatePreview(); syncPrecioNuevo(); });
      margenNuevoInput.addEventListener('input', () => { lastEditedPrecio = 'margen'; syncPrecioNuevo(); });
      precioNuevoInput.addEventListener('input', () => { lastEditedPrecio = 'precio'; syncPrecioNuevo(); });
      syncPrecioNuevo();

      overlay.querySelector('#cancelBtn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#saveCompraBtn').addEventListener('click', () => {
        const cant = Number(cantidadInput.value) || 0;
        const costoCompra = Number(costoInput.value) || 0;
        const fecha = overlay.querySelector('#c_fecha').value || todayStr();
        if(cant <= 0){ cantidadInput.focus(); return; }
        const nuevoCosto = calcularNuevoCosto(cant, costoCompra);
        const nuevoStock = stockActual + cant;
        const precioFinal = Number(precioNuevoInput.value) || p.precio || 0;
        const margenFinal = Number(margenNuevoInput.value) || 0;
        inventario = inventario.map(x => {
          if(x.id !== p.id) return x;
          return { ...x, stock: nuevoStock, costo: nuevoCosto, precio: precioFinal, margen: margenFinal };
        });
        gastos = [...gastos, {
          id: uid(),
          descripcion: `Compra de inventario: ${p.nombre} x${cant}`,
          monto: cant * costoCompra,
          fecha,
          categoria: 'Inventario',
        }];
        save('cuentas_inventario', inventario);
        save('cuentas_gastos', gastos);
        overlay.remove();
        renderList();
      });
      updatePreview();
    });
  }
  function openGastoForm(id){
    const record = id ? gastos.find(g => g.id === id) : null;

    // Editar un gasto existente: formulario simple, sin cambiar de tipo
    let emet = record ? (record.metodo || 'efectivo') : 'efectivo';
    if(record){
      openOverlay(`
        <div class="sheet-handle"></div>
        <h2>Editar gasto</h2>
        ${record.tipo === 'compra' ? `<div class="step-note">📦 Este gasto viene de una compra de inventario. Editar el monto aquí no ajusta el stock ni el costo del producto — eso se hace desde Inventario.</div>` : ''}
        <div class="field"><label>Descripción</label><input type="text" id="f_desc" value="${escapeHtml(record.descripcion)}" placeholder="¿En qué se gastó?"></div>
        <div class="row2">
          <div class="field mono"><label>Monto (${config.moneda})</label><input type="number" inputmode="decimal" id="f_monto" value="${record.monto}" placeholder="0.00"></div>
          <div class="field"><label>Fecha</label><input type="date" id="f_fecha" value="${record.fecha}"></div>
        </div>
        <div class="field"><label>Categoría (opcional)</label><input type="text" id="f_cat" value="${escapeHtml(record.categoria)}" placeholder="Ej. Renta, Insumos, Transporte"></div>
        <div class="section-label" style="margin:8px 0 6px;">¿Con qué lo pagaste?</div>
        ${segHtml('gmet', [['efectivo','Efectivo'],['tarjeta','Tarjeta']], emet)}
        <div class="sheet-actions">
          <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
          <button class="btn btn-primary" id="saveBtn">Guardar</button>
        </div>
        <button class="btn-danger-text" id="deleteBtn">Eliminar</button>
      `, (overlay) => {
        overlay.addEventListener('click', (e) => {
          const b = e.target.closest('[data-group="gmet"] button');
          if(!b) return;
          emet = b.dataset.val;
          overlay.querySelectorAll('[data-group="gmet"] button').forEach(x => x.classList.toggle('on', x === b));
        });
        overlay.querySelector('#cancelBtn').addEventListener('click', () => overlay.remove());
        overlay.querySelector('#saveBtn').addEventListener('click', () => {
          const descripcion = overlay.querySelector('#f_desc').value.trim();
          if(!descripcion){ overlay.querySelector('#f_desc').focus(); return; }
          const data = {
            ...record,
            descripcion,
            monto: Number(overlay.querySelector('#f_monto').value) || 0,
            fecha: overlay.querySelector('#f_fecha').value || todayStr(),
            categoria: overlay.querySelector('#f_cat').value.trim(),
            metodo: emet,
          };
          gastos = gastos.map(g => g.id === record.id ? data : g);
          save('cuentas_gastos', gastos);
          overlay.remove();
          renderList();
        });
        overlay.querySelector('#deleteBtn').addEventListener('click', () => {
          gastos = gastos.filter(g => g.id !== record.id);
          save('cuentas_gastos', gastos);
          overlay.remove();
          renderList();
        });
      });
      return;
    }

    // Nuevo gasto: elegir entre gasto general o compra de inventario
    let tipo = 'general';
    let compraProducto = null;
    let compraEsNuevo = false;
    let compraNuevoNombre = '';
    let gMetodo = 'efectivo';

    const overlay = openOverlay(bodyMain(), mountMain);

    function bodyMain(){
      return `
        <div class="sheet-handle"></div>
        <h2>Nuevo gasto</h2>
        <div class="chip-row" style="margin-bottom:4px;">
          <div class="chip ${tipo === 'general' ? 'active' : ''}" data-tipo="general">Gasto general</div>
          <div class="chip ${tipo === 'compra' ? 'active' : ''}" data-tipo="compra">📦 Compra de inventario</div>
        </div>
        <div id="gastoBody"></div>
        <div class="sheet-actions" style="margin-top:14px;">
          <button class="btn btn-secondary" id="cancelBtn">Cancelar</button>
          <button class="btn btn-primary" id="saveBtn">Guardar</button>
        </div>
      `;
    }

    function bodyGeneral(){
      return `
        <div class="field"><label>Descripción</label><input type="text" id="f_desc" placeholder="¿En qué se gastó?"></div>
        <div class="row2">
          <div class="field mono"><label>Monto (${config.moneda})</label><input type="number" inputmode="decimal" id="f_monto" placeholder="0.00"></div>
          <div class="field"><label>Fecha</label><input type="date" id="f_fecha" value="${todayStr()}"></div>
        </div>
        <div class="field"><label>Categoría (opcional)</label><input type="text" id="f_cat" placeholder="Ej. Renta, Insumos, Transporte"></div>
        <div class="section-label" style="margin:8px 0 6px;">¿Con qué lo pagaste?</div>
        ${segHtml('gmet', [['efectivo','Efectivo'],['tarjeta','Tarjeta']], gMetodo)}
      `;
    }

    function bodyCompra(){
      const stockActual = compraProducto ? ((compraProducto.stock === '' || compraProducto.stock === null) ? 0 : Number(compraProducto.stock)) : 0;
      const costoActual = compraProducto ? (Number(compraProducto.costo) || 0) : 0;
      const productoListo = compraEsNuevo ? compraNuevoNombre.trim().length > 0 : !!compraProducto;
      return `
        <div class="section-label" style="margin:0 0 6px;">¿Con qué lo pagaste?</div>
        ${segHtml('gmet', [['efectivo','Efectivo'],['tarjeta','Tarjeta']], gMetodo)}
        ${!compraEsNuevo ? `
          <div class="field"><label>Producto</label></div>
          ${compraProducto ? `
            <div class="pick-row" style="border:1px solid var(--border); border-radius:10px; margin-bottom:14px;">
              <span class="name">${escapeHtml(compraProducto.nombre)}</span>
              <button class="link-btn" id="changeProdBtn">Cambiar</button>
            </div>
          ` : `
            <div class="add-item-row"><input type="text" id="prodSearchG" placeholder="Buscar producto..."></div>
            <div class="pick-list" id="prodPickListG" style="display:none;"></div>
          `}
          ${!compraProducto ? `<button class="link-btn" id="nuevoProdBtn" style="display:block; margin:-8px 0 14px;">+ Registrar producto nuevo</button>` : ''}
        ` : `
          <div class="field"><label>Nombre del producto nuevo</label><input type="text" id="f_nuevoNombre" value="${escapeHtml(compraNuevoNombre)}" placeholder="Nombre"></div>
          <button class="link-btn" id="usarExistenteBtn" style="display:block; margin:-8px 0 14px;">Usar un producto ya registrado</button>
        `}
        ${productoListo ? `
          <div class="row2">
            <div class="field mono"><label>Cantidad comprada</label><input type="number" inputmode="numeric" id="c_cantidad" placeholder="Ej. 10"></div>
            <div class="field mono"><label>Costo unitario (${config.moneda})</label><input type="number" inputmode="decimal" id="c_costo" value="${costoActual || ''}" placeholder="0.00"></div>
          </div>
          <div class="field"><label>Fecha de la compra</label><input type="date" id="c_fecha" value="${todayStr()}"></div>
          <div class="step-note" id="promedioPreview" style="margin-top:-6px;"></div>
          <div class="row2">
            <div class="field mono"><label>Precio de venta (${config.moneda})</label><input type="number" inputmode="decimal" id="c_precioNuevo" value="${compraProducto ? (compraProducto.precio || '') : ''}" placeholder="0.00"></div>
            <div class="field mono"><label>Ganancia (%)</label><input type="number" inputmode="decimal" id="c_margenNuevo" value="${compraProducto ? (compraProducto.margen || '') : ''}" placeholder="Ej. 40"></div>
          </div>
          <div class="step-note" id="gananciaNuevaPreview" style="margin-top:-6px;"></div>
        ` : ''}
      `;
    }

    function renderGastoBody(sheet){
      const gastoBody = sheet.querySelector('#gastoBody');
      gastoBody.innerHTML = tipo === 'general' ? bodyGeneral() : bodyCompra();
      if(tipo === 'compra') mountCompraBody(sheet, gastoBody);
    }

    function mountCompraBody(sheet, gastoBody){
      const stockActual = compraProducto ? ((compraProducto.stock === '' || compraProducto.stock === null) ? 0 : Number(compraProducto.stock)) : 0;
      const costoActual = compraProducto ? (Number(compraProducto.costo) || 0) : 0;

      const prodSearch = gastoBody.querySelector('#prodSearchG');
      if(prodSearch){
        const prodPickList = gastoBody.querySelector('#prodPickListG');
        prodSearch.addEventListener('input', () => {
          const term = prodSearch.value.trim().toLowerCase();
          if(!term){ prodPickList.style.display = 'none'; prodPickList.innerHTML = ''; return; }
          const matches = inventario.filter(p => p.nombre.toLowerCase().includes(term)).slice(0,8);
          prodPickList.style.display = 'block';
          prodPickList.innerHTML = matches.length === 0
            ? `<div class="pick-row" style="cursor:default;"><span class="name">Sin productos con ese nombre</span></div>`
            : matches.map(p => `<div class="pick-row" data-id="${p.id}"><span class="name">${escapeHtml(p.nombre)}</span><span class="meta">${money(p.precio)}</span></div>`).join('');
          prodPickList.querySelectorAll('.pick-row[data-id]').forEach(row => row.addEventListener('click', () => {
            compraProducto = inventario.find(x => x.id === row.getAttribute('data-id'));
            renderGastoBody(sheet);
          }));
        });
      }
      const changeBtn = gastoBody.querySelector('#changeProdBtn');
      if(changeBtn) changeBtn.addEventListener('click', () => { compraProducto = null; renderGastoBody(sheet); });
      const nuevoProdBtn = gastoBody.querySelector('#nuevoProdBtn');
      if(nuevoProdBtn) nuevoProdBtn.addEventListener('click', () => { compraEsNuevo = true; compraProducto = null; renderGastoBody(sheet); });
      const usarExistenteBtn = gastoBody.querySelector('#usarExistenteBtn');
      if(usarExistenteBtn) usarExistenteBtn.addEventListener('click', () => { compraEsNuevo = false; renderGastoBody(sheet); });
      const nuevoNombreInput = gastoBody.querySelector('#f_nuevoNombre');
      if(nuevoNombreInput) nuevoNombreInput.addEventListener('input', () => {
        compraNuevoNombre = nuevoNombreInput.value;
        const listo = compraNuevoNombre.trim().length > 0;
        const hasExtra = !!gastoBody.querySelector('#c_cantidad');
        if(listo !== hasExtra) renderGastoBody(sheet);
      });

      const cantidadInput = gastoBody.querySelector('#c_cantidad');
      if(!cantidadInput) return;
      const costoInput = gastoBody.querySelector('#c_costo');
      const preview = gastoBody.querySelector('#promedioPreview');
      const precioNuevoInput = gastoBody.querySelector('#c_precioNuevo');
      const margenNuevoInput = gastoBody.querySelector('#c_margenNuevo');
      const gananciaNuevaPreview = gastoBody.querySelector('#gananciaNuevaPreview');
      let lastEditedPrecio = (compraProducto && Number(compraProducto.margen)) ? 'margen' : 'precio';

      function calcularNuevoCosto(cant, costoCompra){
        if(stockActual > 0 && costoActual > 0) return ((stockActual * costoActual) + (cant * costoCompra)) / (stockActual + cant);
        return costoCompra || costoActual;
      }
      function updatePreview(){
        const cant = Number(cantidadInput.value) || 0;
        const costoCompra = Number(costoInput.value) || 0;
        if(cant > 0 && costoCompra > 0){
          const nuevoCosto = calcularNuevoCosto(cant, costoCompra);
          preview.textContent = (stockActual > 0 && costoActual > 0)
            ? `Nuevo costo promedio: ${money(nuevoCosto)} por unidad (antes ${money(costoActual)})`
            : `Costo por unidad: ${money(nuevoCosto)}`;
        } else { preview.textContent = ''; }
      }
      function syncPrecioNuevo(){
        const cant = Number(cantidadInput.value) || 0;
        const costoCompra = Number(costoInput.value) || 0;
        const nuevoCosto = calcularNuevoCosto(cant, costoCompra);
        if(lastEditedPrecio === 'margen'){
          const margen = Number(margenNuevoInput.value) || 0;
          if(nuevoCosto > 0) precioNuevoInput.value = (nuevoCosto * (1 + margen/100)).toFixed(2);
        } else {
          const precio = Number(precioNuevoInput.value) || 0;
          if(nuevoCosto > 0) margenNuevoInput.value = Math.round(((precio - nuevoCosto) / nuevoCosto) * 100);
        }
        const precioFinal = Number(precioNuevoInput.value) || 0;
        if(nuevoCosto > 0 && precioFinal > 0){
          gananciaNuevaPreview.textContent = `Con este precio ganas ${money(precioFinal - nuevoCosto)} por unidad`;
        } else { gananciaNuevaPreview.textContent = ''; }
      }
      cantidadInput.addEventListener('input', () => { updatePreview(); syncPrecioNuevo(); });
      costoInput.addEventListener('input', () => { updatePreview(); syncPrecioNuevo(); });
      margenNuevoInput.addEventListener('input', () => { lastEditedPrecio = 'margen'; syncPrecioNuevo(); });
      precioNuevoInput.addEventListener('input', () => { lastEditedPrecio = 'precio'; syncPrecioNuevo(); });
      updatePreview();
      syncPrecioNuevo();
    }

    function mountMain(ov, sheet){
      renderGastoBody(sheet);
      sheet.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
        tipo = chip.getAttribute('data-tipo');
        sheet.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
        renderGastoBody(sheet);
      }));
      sheet.addEventListener('click', (e) => {
        const b = e.target.closest('[data-group="gmet"] button');
        if(!b) return;
        gMetodo = b.dataset.val;
        sheet.querySelectorAll('[data-group="gmet"] button').forEach(x => x.classList.toggle('on', x === b));
      });
      sheet.querySelector('#cancelBtn').addEventListener('click', () => ov.remove());
      sheet.querySelector('#saveBtn').addEventListener('click', () => {
        if(tipo === 'general'){
          const descInput = sheet.querySelector('#f_desc');
          const descripcion = descInput.value.trim();
          if(!descripcion){ descInput.focus(); return; }
          gastos = [...gastos, {
            id: uid(), tipo: 'general', metodo: gMetodo,
            descripcion,
            monto: Number(sheet.querySelector('#f_monto').value) || 0,
            fecha: sheet.querySelector('#f_fecha').value || todayStr(),
            categoria: sheet.querySelector('#f_cat').value.trim(),
          }];
          save('cuentas_gastos', gastos);
          ov.remove();
          renderList();
          return;
        }

        // tipo === 'compra'
        const cantidadInput = sheet.querySelector('#c_cantidad');
        if(!cantidadInput){ return; }
        const cant = Number(cantidadInput.value) || 0;
        const costoCompra = Number(sheet.querySelector('#c_costo').value) || 0;
        const fecha = sheet.querySelector('#c_fecha').value || todayStr();
        if(cant <= 0){ cantidadInput.focus(); return; }

        let producto = compraProducto;
        let nombreProducto = compraEsNuevo ? compraNuevoNombre.trim() : (producto ? producto.nombre : '');
        if(compraEsNuevo && !nombreProducto){ sheet.querySelector('#f_nuevoNombre').focus(); return; }

        const precioNuevoInput = sheet.querySelector('#c_precioNuevo');
        const margenNuevoInput = sheet.querySelector('#c_margenNuevo');
        const precioFinal = Number(precioNuevoInput.value) || costoCompra || 0;
        const margenFinal = Number(margenNuevoInput.value) || 0;

        let productoId;
        if(compraEsNuevo){
          const nuevoProducto = {
            id: uid(), nombre: nombreProducto, categoria: '',
            costo: costoCompra, margen: margenFinal, precio: precioFinal, stock: cant,
          };
          inventario = [...inventario, nuevoProducto];
          movimientos = [...movimientos, { id: uid(), tipo: 'alta', ts: Date.now(), productoId: nuevoProducto.id, productoNombre: nombreProducto, stockNuevo: cant, motivo: 'Creado desde una compra', fecha: todayStr() }];
          save('cuentas_movimientos', movimientos);
          productoId = nuevoProducto.id;
        } else {
          const stockActual = (producto.stock === '' || producto.stock === null) ? 0 : Number(producto.stock);
          const costoActual = Number(producto.costo) || 0;
          const nuevoCosto = (stockActual > 0 && costoActual > 0)
            ? ((stockActual * costoActual) + (cant * costoCompra)) / (stockActual + cant)
            : (costoCompra || costoActual);
          const nuevoStock = stockActual + cant;
          inventario = inventario.map(x => x.id === producto.id ? { ...x, stock: nuevoStock, costo: nuevoCosto, precio: precioFinal, margen: margenFinal } : x);
          productoId = producto.id;
        }

        gastos = [...gastos, {
          id: uid(), tipo: 'compra', metodo: gMetodo, productoId, cantidad: cant,
          descripcion: `Compra de inventario: ${nombreProducto} x${cant}`,
          monto: cant * costoCompra,
          fecha,
          categoria: 'Inventario',
        }];
        save('cuentas_inventario', inventario);
        save('cuentas_gastos', gastos);
        ov.remove();
        renderList();
      });
    }
  }

  // ============================================================
  // FACTURAS — flujo de nueva venta/factura
  // ============================================================
  function openVentaWizard(){
    if(clientes.length === 0){
      openOverlay(`
        <div class="sheet-handle"></div>
        <h2>Necesitas un cliente</h2>
        <p style="color:var(--ink-soft); font-size:14px; line-height:1.5;">Antes de registrar una venta, registra al menos un cliente en la pestaña Clientes.</p>
        <div class="sheet-actions"><button class="btn btn-primary" id="okBtn" style="flex:1;">Entendido</button></div>
      `, (overlay) => overlay.querySelector('#okBtn').addEventListener('click', () => overlay.remove()));
      return;
    }
    const cart = [];
    let selectedCliente = null;
    let notas = '';
    let descuentoPct = 0;
    let metodoPago = 'efectivo';
    let tipoOp = 'venta';
    let abonoIni = 0;
    let abonoMet = 'efectivo';
    let mixEf = 0;
    let mixTj = 0;

    function sumaItems(){ return cart.reduce((s,it) => s + it.precioUnit * it.cantidad, 0); }
    function descuentoMonto(){ return sumaItems() * (Number(descuentoPct)||0) / 100; }
    function subtotal(){ return sumaItems() - descuentoMonto(); }
    function impuestoMonto(){ return subtotal() * (Number(config.impuesto)||0) / 100; }
    function total(){ return subtotal() + impuestoMonto(); }
    function stockMax(productoId){
      const p = inventario.find(x => x.id === productoId);
      if(!p || p.stock === '' || p.stock === null || p.stock === undefined) return Infinity;
      return Math.max(0, (Number(p.stock) || 0) - unidadesReservadas(productoId));
    }
    function sinStockMsg(nombre, max){
      return max <= 0 ? `${nombre} no tiene stock disponible (puede estar reservado para pedidos).` : `Solo tienes ${max} unid. disponibles de ${nombre} (el resto está reservado para pedidos).`;
    }

    const overlay = openOverlay(bodyStep1(), mountStep1);

    function bodyStep1(){
      return `
        <div class="sheet-handle"></div>
        <h2>Nueva venta</h2>
        <div class="step-note">Paso 1 de 2 · elige el cliente</div>
        <div class="pick-list">
          ${clientes.map(c => `<div class="pick-row" data-id="${c.id}"><span class="name">${escapeHtml(c.nombre)}</span><span class="meta">${escapeHtml(c.telefono||'')}</span></div>`).join('')}
        </div>
        <div class="sheet-actions"><button class="btn btn-secondary" id="cancelBtn" style="flex:1;">Cancelar</button></div>
      `;
    }
    function mountStep1(ov, sheet){
      sheet.querySelector('#cancelBtn').addEventListener('click', () => ov.remove());
      sheet.querySelectorAll('.pick-row').forEach(row => row.addEventListener('click', () => {
        selectedCliente = clientes.find(c => c.id === row.getAttribute('data-id'));
        sheet.innerHTML = bodyStep2();
        mountStep2(ov, sheet);
      }));
    }

    function bodyStep2(){
      return `
        <div class="sheet-handle"></div>
        <h2>Nueva venta</h2>
        <div class="step-note">Paso 2 de 2 · cliente: ${escapeHtml(selectedCliente.nombre)}</div>
        <div class="add-item-row"><input type="text" id="prodSearch" placeholder="Buscar producto..."></div>
        <div class="pick-list" id="prodPickList" style="display:none;"></div>
        <button class="link-btn" id="svcBtn" style="display:block; margin:8px 0 0;">+ Agregar servicio o producto libre</button>
        <button class="link-btn" id="medidaBtn" style="display:block; margin:4px 0 0;">+ Prenda a medida (con materiales del stock)</button>
        <div id="cartWrap"></div>
        <div class="field" style="margin-top:14px;"><label>Notas para el cliente (opcional)</label><textarea id="f_notas" rows="2" placeholder="Ej. Forma de pago, garantía, condiciones de entrega">${escapeHtml(notas)}</textarea></div>
        <div class="section-label" style="margin:14px 0 8px;">¿Qué estás registrando?</div>
        ${segHtml('tipoop', [['venta','Venta'],['pedido','Pedido'],['encargo','Encargo'],['apartado','Apartado']], tipoOp)}
        <div id="opWrap" style="margin-top:12px;"></div>
        <div id="payBlock">
          <div class="section-label" style="margin:14px 0 8px;">Forma de pago</div>
          ${segHtml('pago', [['efectivo','Efectivo'],['tarjeta','Tarjeta'],['credito','A crédito'],['mixto','Mixto']], metodoPago)}
          <div id="abonoWrap" style="margin-top:12px;"></div>
        </div>
        <div class="totals-box" id="totalsBox"></div>
        <div id="gananciaWrap"></div>
        <div class="sheet-actions" style="margin-top:14px;">
          <button class="btn btn-secondary" id="backBtn">Atrás</button>
          <button class="btn btn-primary" id="saveVentaBtn">Registrar venta</button>
        </div>
      `;
    }
    function mountStep2(ov, sheet){
      const prodSearch = sheet.querySelector('#prodSearch');
      const prodPickList = sheet.querySelector('#prodPickList');
      const cartWrap = sheet.querySelector('#cartWrap');
      const totalsBox = sheet.querySelector('#totalsBox');
      const saveBtn = sheet.querySelector('#saveVentaBtn');
      let opMetodo = 'efectivo';
      function renderOpWrap(){
        const wrap = sheet.querySelector('#opWrap');
        const pay = sheet.querySelector('#payBlock');
        const btn = sheet.querySelector('#saveVentaBtn');
        if(tipoOp === 'venta'){
          wrap.innerHTML = '';
          pay.style.display = '';
          btn.textContent = 'Registrar venta';
          return;
        }
        pay.style.display = 'none';
        const esPedido = tipoOp === 'pedido', esEnc = tipoOp === 'encargo', esApa = tipoOp === 'apartado';
        wrap.innerHTML = `
          ${esApa ? '' : `<div class="row2"><div class="field"><label>${esEnc ? 'Llegada estimada (opcional)' : 'Fecha de entrega'}</label><input type="date" id="op_fecha" value="${esEnc ? '' : todayStr()}"></div></div>`}
          <div class="row2">
            <div class="field mono"><label>${esApa ? 'Abono inicial' : 'Anticipo'} (${config.moneda})</label><input type="number" inputmode="decimal" id="op_anticipo" placeholder="0"></div>
            <div class="field"><label>Fecha del abono</label><input type="date" id="op_fechaAnt" value="${todayStr()}"></div>
          </div>
          ${esApa ? segHtml('opmet', [['efectivo','Efectivo'],['tarjeta','Tarjeta']], opMetodo) : ''}
          <div class="step-note">${esPedido ? 'Los productos quedan reservados hasta la fecha de entrega.' : esEnc ? 'No descuenta stock. Lo entregas cuando el producto llegue y lo registres en inventario.' : 'Los productos quedan reservados. Los abonos los registras cuando lleguen.'}</div>`;
        btn.textContent = esPedido ? 'Agendar pedido' : esEnc ? 'Registrar encargo' : 'Crear apartado';
      }
      function guardarPendiente(){
        if(cart.length === 0){ alert('Agrega productos primero.'); return; }
        if(cart.some(it => (it.materiales || []).length)){ alert('Las prendas a medida solo se pueden registrar como venta.'); return; }
        if(tipoOp !== 'encargo'){
          const excedido = cart.find(it => it.cantidad > stockMax(it.productoId));
          if(excedido){ alert(sinStockMsg(excedido.nombre, stockMax(excedido.productoId))); return; }
        }
        const fechaEl = sheet.querySelector('#op_fecha');
        const fecha = fechaEl ? fechaEl.value : '';
        if(tipoOp === 'pedido' && !fecha){ fechaEl.focus(); return; }
        const anticipo = Number(sheet.querySelector('#op_anticipo').value) || 0;
        const fechaAnt = sheet.querySelector('#op_fechaAnt').value || todayStr();
        const abonos = (tipoOp === 'apartado' && anticipo > 0)
          ? [{ id: uid(), fecha: fechaAnt, monto: anticipo, metodo: opMetodo, nota: 'Abono inicial' }]
          : [];
        const nuevo = {
          id: uid(), clienteId: selectedCliente.id, clienteNombre: selectedCliente.nombre,
          tipo: tipoOp,
          fechaEntrega: tipoOp === 'apartado' ? '' : fecha,
          anticipo: tipoOp === 'apartado' ? abonos.reduce((s,a) => s + a.monto, 0) : anticipo,
          fechaAnticipo: fechaAnt,
          abonos,
          items: cart.map(it => ({ productoId: it.productoId, nombre: it.nombre, cantidad: it.cantidad, precio: it.precioUnit, caracteristicas: '', costo: Number(it.costo) || 0 })),
          notas: notas || '',
          estado: 'pendiente',
          creadoTs: Date.now(),
        };
        pedidos = [...pedidos, nuevo];
        save('cuentas_pedidos', pedidos);
        ov.remove();
        ventasVista = 'pedidos';
        renderList();
        alert(tipoOp === 'pedido' ? 'Pedido agendado. Los productos quedan reservados hasta la entrega.'
          : tipoOp === 'encargo' ? 'Encargo registrado. Lo entregas cuando el producto llegue.'
          : 'Apartado creado. Los productos quedan reservados hasta que se paguen.');
      }
      sheet.querySelectorAll('[data-group="tipoop"] button').forEach(b => b.addEventListener('click', () => {
        tipoOp = b.dataset.val;
        sheet.querySelectorAll('[data-group="tipoop"] button').forEach(x => x.classList.toggle('on', x === b));
        renderOpWrap();
      }));
      sheet.querySelector('#opWrap').addEventListener('click', (e) => {
        const b = e.target.closest('[data-group="opmet"] button');
        if(!b) return;
        opMetodo = b.dataset.val;
        sheet.querySelectorAll('[data-group="opmet"] button').forEach(x => x.classList.toggle('on', x === b));
      });
      renderOpWrap();
      const notasInput = sheet.querySelector('#f_notas');
      const gananciaWrap = sheet.querySelector('#gananciaWrap');
      let gananciaOpen = false;
      notasInput.addEventListener('input', () => { notas = notasInput.value; });
      const abonoWrap = sheet.querySelector('#abonoWrap');
      function renderAbonoWrap(){
        sheet.querySelectorAll('[data-group="pago"] button').forEach(b => b.classList.toggle('on', b.dataset.val === metodoPago));
        if(metodoPago === 'credito'){
          abonoWrap.innerHTML = `
            <div class="field mono"><label>Abono inicial (${config.moneda}) · opcional</label><input type="number" inputmode="decimal" id="f_abonoIni" value="${abonoIni || ''}" placeholder="0"></div>
            <div class="field"><label>Medio del abono inicial</label>${segHtml('abmet', [['efectivo','Efectivo'],['tarjeta','Tarjeta']], abonoMet)}</div>
            <div class="step-note">Saldo a crédito: <strong id="restVal"></strong></div>`;
        } else if(metodoPago === 'mixto'){
          abonoWrap.innerHTML = `
            <div class="row2">
              <div class="field mono"><label>Efectivo (${config.moneda})</label><input type="number" inputmode="decimal" id="f_efectivo" value="${mixEf || ''}" placeholder="0"></div>
              <div class="field mono"><label>Tarjeta (${config.moneda})</label><input type="number" inputmode="decimal" id="f_tarjeta" value="${mixTj || ''}" placeholder="0"></div>
            </div>
            <div class="step-note">Lo que quede se registra como saldo a crédito: <strong id="restVal"></strong></div>`;
        } else {
          abonoWrap.innerHTML = '';
        }
        updateRest();
      }
      function updateRest(){
        const el = abonoWrap.querySelector('#restVal');
        if(!el) return;
        const t = total();
        let rest;
        if(metodoPago === 'credito'){ rest = t - Math.min(abonoIni, t); }
        else { const ef = Math.min(mixEf, t); rest = t - ef - Math.min(mixTj, t - ef); }
        el.textContent = money(Math.max(0, rest));
      }
      function calcPagos(){
        const t = total();
        const hoy = todayStr();
        if(metodoPago === 'efectivo' || metodoPago === 'tarjeta'){
          return { fiado: false, pagos: [{ id: uid(), fecha: hoy, monto: t, metodo: metodoPago, nota: '' }] };
        }
        if(metodoPago === 'credito'){
          const ini = Math.min(abonoIni, t);
          return { fiado: true, pagos: ini > 0 ? [{ id: uid(), fecha: hoy, monto: ini, metodo: abonoMet, nota: 'Abono inicial' }] : [] };
        }
        const ef = Math.min(mixEf, t);
        const tj = Math.min(mixTj, t - ef);
        const pagos = [];
        if(ef > 0) pagos.push({ id: uid(), fecha: hoy, monto: ef, metodo: 'efectivo', nota: 'Mixto' });
        if(tj > 0) pagos.push({ id: uid(), fecha: hoy, monto: tj, metodo: 'tarjeta', nota: 'Mixto' });
        return { fiado: (t - ef - tj) > 0, pagos };
      }
      sheet.querySelectorAll('[data-group="pago"] button').forEach(b => b.addEventListener('click', () => {
        metodoPago = b.dataset.val;
        renderAbonoWrap();
      }));
      abonoWrap.addEventListener('click', (e) => {
        const b = e.target.closest('[data-group="abmet"] button');
        if(!b) return;
        abonoMet = b.dataset.val;
        renderAbonoWrap();
      });
      abonoWrap.addEventListener('input', (e) => {
        if(e.target.id === 'f_abonoIni') abonoIni = Number(e.target.value) || 0;
        else if(e.target.id === 'f_efectivo') mixEf = Number(e.target.value) || 0;
        else if(e.target.id === 'f_tarjeta') mixTj = Number(e.target.value) || 0;
        updateRest();
      });
      sheet.addEventListener('click', updateRest);
      sheet.addEventListener('input', updateRest);
      renderAbonoWrap();

      function costoTotal(){ return cart.reduce((s,it) => s + (Number(it.costo)||0) * it.cantidad, 0); }
      function gananciaEstimada(){ return subtotal() - costoTotal(); }

      function renderGanancia(){
        const g = gananciaEstimada();
        const ct = costoTotal();
        const margenPct = ct > 0 ? Math.round((g / ct) * 100) : null;
        gananciaWrap.innerHTML = `
          <div class="ganancia-panel">
            <div class="ganancia-toggle" id="gananciaToggle">
              <span class="g-label">Ganancia estimada de esta venta</span>
              <span><span class="g-value ${g >= 0 ? 'pos' : 'neg'}">${money(g)}</span><span class="chev">${gananciaOpen ? '▲' : '▼'}</span></span>
            </div>
            ${gananciaOpen ? `
              <div class="ganancia-body">
                <div class="totals-row"><span>Costo de los productos</span><span>${money(ct)}</span></div>
                <div class="totals-row"><span>Ingreso (después de descuento)</span><span>${money(subtotal())}</span></div>
                ${margenPct !== null ? `<div class="totals-row"><span>Margen sobre el costo</span><span>${margenPct}%</span></div>` : ''}
              </div>
            ` : ''}
          </div>
        `;
        gananciaWrap.querySelector('#gananciaToggle').addEventListener('click', () => { gananciaOpen = !gananciaOpen; renderGanancia(); });
      }

      sheet.querySelector('#backBtn').addEventListener('click', () => {
        selectedCliente = null;
        sheet.innerHTML = bodyStep1();
        mountStep1(ov, sheet);
      });

      function renderProdPick(){
        const term = prodSearch.value.trim().toLowerCase();
        if(!term){ prodPickList.style.display = 'none'; prodPickList.innerHTML=''; return; }
        const matches = inventario.filter(p => p.nombre.toLowerCase().includes(term)).slice(0,8);
        if(matches.length === 0){
          prodPickList.style.display = 'block';
          prodPickList.innerHTML = `<div class="pick-row" style="cursor:default;"><span class="name">Sin productos con ese nombre</span></div>`;
          return;
        }
        prodPickList.style.display = 'block';
        prodPickList.innerHTML = matches.map(p => `<div class="pick-row" data-id="${p.id}"><span class="name">${escapeHtml(p.nombre)}</span><span class="meta">${money(p.precio)}</span></div>`).join('');
        prodPickList.querySelectorAll('.pick-row[data-id]').forEach(row => row.addEventListener('click', () => {
          const p = inventario.find(x => x.id === row.getAttribute('data-id'));
          const existing = cart.find(it => it.productoId === p.id);
          const enCarrito = existing ? existing.cantidad : 0;
          if(enCarrito + 1 > stockMax(p.id)){ alert(sinStockMsg(p.nombre, stockMax(p.id))); return; }
          if(existing) existing.cantidad += 1;
          else cart.push({ productoId: p.id, nombre: p.nombre, precioCatalogo: p.precio, precioUnit: p.precio, costo: Number(p.costo)||0, cantidad: 1, stockDisponible: p.stock });
          prodSearch.value = '';
          prodPickList.style.display = 'none';
          renderCart();
        }));
      }
      prodSearch.addEventListener('input', renderProdPick);

      sheet.querySelector('#svcBtn').addEventListener('click', () => {
        openOverlay(`
          <div class="sheet-handle"></div>
          <h2>Servicio o producto libre</h2>
          <div class="step-note">Para algo que no está en tu inventario, como una asesoría. No descuenta stock.</div>
          <div class="field"><label>Nombre</label><input type="text" id="sv_nombre" placeholder="Ej. Asesoría, arreglo, envío"></div>
          <div class="row2">
            <div class="field mono"><label>Precio (${config.moneda})</label><input type="number" inputmode="decimal" id="sv_precio" placeholder="0"></div>
            <div class="field mono"><label>Cantidad</label><input type="number" inputmode="numeric" id="sv_cant" value="1"></div>
          </div>
          <div class="field mono"><label>Costo (opcional, ${config.moneda})</label><input type="number" inputmode="decimal" id="sv_costo" placeholder="0"></div>
          <div class="sheet-actions">
            <button class="btn btn-secondary" id="svVolver">Volver</button>
            <button class="btn btn-primary" id="svAgregar">Agregar</button>
          </div>
        `, (svOv) => {
          svOv.querySelector('#svVolver').addEventListener('click', () => svOv.remove());
          svOv.querySelector('#svAgregar').addEventListener('click', () => {
            const nombre = svOv.querySelector('#sv_nombre').value.trim();
            const precio = Number(svOv.querySelector('#sv_precio').value) || 0;
            const cant = Number(svOv.querySelector('#sv_cant').value) || 0;
            const costo = Number(svOv.querySelector('#sv_costo').value) || 0;
            if(!nombre){ svOv.querySelector('#sv_nombre').focus(); return; }
            if(cant <= 0){ svOv.querySelector('#sv_cant').focus(); return; }
            cart.push({ productoId: null, nombre, precioCatalogo: precio, precioUnit: precio, costo, cantidad: cant, stockDisponible: '' });
            svOv.remove();
            renderCart();
          });
        });
      });

      sheet.querySelector('#medidaBtn').addEventListener('click', () => {
        if(tipoOp !== 'venta'){ alert('Las prendas a medida se registran como venta. Cambia el tipo a Venta.'); return; }
        let foto = '';
        let mats = [{ productoId: '', cantidad: 1 }];
        openOverlay(`
          <div class="sheet-handle"></div>
          <h2>Prenda a medida</h2>
          <div class="step-note">Descuenta los materiales del stock. La prenda no se guarda como producto del inventario.</div>
          ${imagePickerHtml('ma_foto', 'Foto de la prenda (opcional)', '', 'Sin foto')}
          <div class="field"><label>Nombre</label><input type="text" id="ma_nombre" placeholder="Ej. Manilla roja y negra"></div>
          <div class="field"><label>Características</label><textarea id="ma_car" rows="2" placeholder="Ej. Cierre ajustable, talla única"></textarea></div>
          <div class="field mono"><label>Cantidad de prendas</label><input type="number" inputmode="numeric" id="ma_cant" value="1"></div>
          <div class="section-label" style="margin:12px 0 6px;">Materiales que usa por prenda</div>
          <div id="ma_lista"></div>
          <button type="button" class="link-btn" id="ma_addMat" style="display:block; margin:6px 0 0;">+ Agregar material</button>
          <div class="totals-box" id="ma_precio_box" style="margin-top:12px;"></div>
          <div id="ma_err" style="color:#b42318; font-size:13px; margin-top:8px;"></div>
          <div class="sheet-actions" style="margin-top:14px;">
            <button class="btn btn-secondary" id="maVolver">Volver</button>
            <button class="btn btn-primary" id="maAgregar">Agregar</button>
          </div>
        `, (maOv) => {
          const lista = maOv.querySelector('#ma_lista');
          const err = maOv.querySelector('#ma_err');
          const precioPrenda = () => mats.reduce((s, m) => {
            const pr = inventario.find(x => x.id === m.productoId);
            return s + (pr ? (Number(pr.precio) || 0) * (Number(m.cantidad) || 0) : 0);
          }, 0);
          const pintarPrecio = () => {
            maOv.querySelector('#ma_precio_box').innerHTML = `
              <div class="tr"><span>Precio por prenda</span><strong>${money(precioPrenda())}</strong></div>
              <div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">Se calcula sumando el precio de cada material elegido.</div>`;
          };
          const pintar = () => {
            lista.innerHTML = mats.map((m, i) => `
              <div class="row2">
                <div class="field"><label>Material ${i + 1}</label><select class="mat-prod" data-mat="${i}"><option value="">Elegir…</option>${inventario.map(x => `<option value="${x.id}" ${x.id === m.productoId ? 'selected' : ''}>${escapeHtml(x.nombre)} · ${money(x.precio)}</option>`).join('')}</select></div>
                <div class="field mono"><label>Cantidad</label><input type="number" inputmode="numeric" class="mat-cant" data-mat="${i}" value="${m.cantidad}"></div>
              </div>
              <button type="button" class="link-btn danger mat-del" data-mat="${i}" style="margin:-4px 0 10px;">Quitar este material</button>`).join('');
            pintarPrecio();
          };
          pintar();
          wireImagePicker(maOv, 'ma_foto', 'Sin foto', 300, (d) => { foto = d; });
          maOv.querySelector('#ma_addMat').addEventListener('click', () => { mats.push({ productoId: '', cantidad: 1 }); pintar(); });
          lista.addEventListener('change', (e) => {
            if(e.target.classList.contains('mat-prod')){ mats[Number(e.target.dataset.mat)].productoId = e.target.value; pintarPrecio(); }
          });
          lista.addEventListener('input', (e) => {
            if(e.target.classList.contains('mat-cant')){ mats[Number(e.target.dataset.mat)].cantidad = Number(e.target.value) || 0; pintarPrecio(); }
          });
          lista.addEventListener('click', (e) => {
            if(e.target.classList.contains('mat-del')){
              mats.splice(Number(e.target.dataset.mat), 1);
              if(!mats.length) mats.push({ productoId: '', cantidad: 1 });
              pintar();
            }
          });
          maOv.querySelector('#maVolver').addEventListener('click', () => maOv.remove());
          maOv.querySelector('#maAgregar').addEventListener('click', () => {
            const nombre = maOv.querySelector('#ma_nombre').value.trim();
            const car = maOv.querySelector('#ma_car').value.trim();
            const cant = Number(maOv.querySelector('#ma_cant').value) || 0;
            const faltan = [];
            if(!nombre) faltan.push('nombre de la prenda');
            if(cant <= 0) faltan.push('cantidad de prendas (mayor que 0)');
            mats.forEach((m, i) => {
              if(!m.productoId) faltan.push(`elegir el material ${i + 1} (o quitarlo)`);
              else if(!(m.cantidad > 0)) faltan.push(`cantidad del material ${i + 1} (mayor que 0)`);
            });
            if(!mats.some(m => m.productoId && m.cantidad > 0)) faltan.push('al menos un material del inventario');
            if(faltan.length){
              err.innerHTML = 'Falta: ' + faltan.join(' · ');
              return;
            }
            const agrupados = mats.reduce((acc, m) => {
              const ex = acc.find(x => x.productoId === m.productoId);
              if(ex) ex.cantidad += m.cantidad; else acc.push({ productoId: m.productoId, cantidad: m.cantidad });
              return acc;
            }, []);
            const materiales = agrupados.map(m => ({ productoId: m.productoId, nombre: (inventario.find(x => x.id === m.productoId) || {}).nombre || '', cantidad: m.cantidad }));
            const costoMat = agrupados.reduce((sum, m) => { const pr = inventario.find(x => x.id === m.productoId); return sum + (pr ? (Number(pr.costo) || 0) * m.cantidad : 0); }, 0);
            const precio = precioPrenda();
            const msg = validarMateriales([{ productoId: null, cantidad: cant, materiales }, ...cart]);
            if(msg){ err.innerHTML = msg; return; }
            cart.push({ productoId: null, nombre, caracteristicas: car, foto, materiales, precioCatalogo: precio, precioUnit: precio, costo: costoMat, cantidad: cant, stockDisponible: '' });
            maOv.remove();
            renderCart();
          });
        });
      });

      function validarMateriales(items){
        const need = {};
        items.forEach(it => {
          if(it.productoId) need[it.productoId] = (need[it.productoId] || 0) + it.cantidad;
          (it.materiales || []).forEach(m => { need[m.productoId] = (need[m.productoId] || 0) + m.cantidad * it.cantidad; });
        });
        for(const id of Object.keys(need)){
          const pr = inventario.find(x => x.id === id);
          const max = stockMax(id);
          if(pr && max !== Infinity && need[id] > max) return `No hay suficiente ${pr.nombre}. Disponibles: ${max}, necesitas: ${need[id]}.`;
        }
        return '';
      }

      function renderCart(){
        if(cart.length === 0){
          cartWrap.innerHTML = `<div class="empty-state" style="margin-top:16px;"><p>Busca productos arriba y tócalos para agregarlos a la factura.</p></div>`;
        } else {
          cartWrap.innerHTML = cart.map((it, idx) => `
            <div class="cart-item" data-idx="${idx}">
              <div class="cart-row1">
                <div class="name">${escapeHtml(it.nombre)}</div>
                <button class="remove">×</button>
              </div>
              <div class="cart-row2">
                <div class="qty-ctrl"><button class="qtyMinus">−</button><span class="qty">${it.cantidad}</span><button class="qtyPlus">+</button></div>
                <input type="number" inputmode="decimal" class="unit-price ${it.precioUnit < it.precioCatalogo ? 'discounted' : ''}" value="${it.precioUnit}">
                <div class="line-total">${money(it.precioUnit * it.cantidad)}</div>
              </div>
            </div>`).join('');
          cartWrap.querySelectorAll('.cart-item').forEach(el => {
            const idx = Number(el.getAttribute('data-idx'));
            el.querySelector('.qtyPlus').addEventListener('click', () => {
              if(cart[idx].cantidad + 1 > stockMax(cart[idx].productoId)){ alert(sinStockMsg(cart[idx].nombre, stockMax(cart[idx].productoId))); return; }
              cart[idx].cantidad += 1; renderCart();
            });
            el.querySelector('.qtyMinus').addEventListener('click', () => { cart[idx].cantidad -= 1; if(cart[idx].cantidad <= 0) cart.splice(idx,1); renderCart(); });
            el.querySelector('.remove').addEventListener('click', () => { cart.splice(idx,1); renderCart(); });
            el.querySelector('.unit-price').addEventListener('change', (e) => {
              cart[idx].precioUnit = Number(e.target.value) || 0;
              renderCart();
            });
          });
        }
        totalsBox.innerHTML = `
          <div class="totals-row"><span>Suma de productos</span><span>${money(sumaItems())}</span></div>
          <div class="discount-field"><label>Descuento sobre la venta (%)</label><input type="number" inputmode="decimal" id="descuentoInput" value="${descuentoPct || ''}" placeholder="0"></div>
          ${descuentoMonto() > 0 ? `<div class="totals-row"><span>Descuento</span><span>-${money(descuentoMonto())}</span></div>` : ''}
          ${Number(config.impuesto) > 0 ? `<div class="totals-row"><span>Impuesto (${config.impuesto}%)</span><span>${money(impuestoMonto())}</span></div>` : ''}
          <div class="totals-row grand"><span>Total a cobrar</span><span>${money(total())}</span></div>
        `;
        const descInput = totalsBox.querySelector('#descuentoInput');
        descInput.addEventListener('change', () => { descuentoPct = Number(descInput.value) || 0; renderCart(); });
        renderGanancia();
        saveBtn.disabled = cart.length === 0;
      }
      renderCart();

      saveBtn.addEventListener('click', () => {
        if(tipoOp !== 'venta'){ guardarPendiente(); return; }
        if(cart.length === 0) return;
        const excedido = cart.find(it => it.cantidad > stockMax(it.productoId));
        if(excedido){ alert(sinStockMsg(excedido.nombre, stockMax(excedido.productoId))); return; }
        const msgMat = validarMateriales(cart);
        if(msgMat){ alert(msgMat); return; }
        const pg = calcPagos();
        const venta = {
          id: uid(), folio: null, creadoTs: Date.now(),
          clienteId: selectedCliente.id, clienteNombre: selectedCliente.nombre,
          clienteDireccion: selectedCliente.direccion || '', clienteTelefono: selectedCliente.telefono || '', clienteEmail: selectedCliente.email || '',
          items: cart.map(it => ({ productoId: it.productoId, nombre: it.nombre, precio: it.precioUnit, cantidad: it.cantidad, caracteristicas: it.caracteristicas || '', foto: it.foto || '', materiales: it.materiales || [] })),
          sumaItems: sumaItems(), descuentoPct, descuentoMonto: descuentoMonto(),
          subtotal: subtotal(), impuesto: impuestoMonto(), total: total(),
          costoTotal: costoTotal(), gananciaEstimada: gananciaEstimada(),
          notas, fecha: todayStr(),
          metodoPago, fiado: pg.fiado,
          abonos: pg.pagos,
        };
        ventas.push(venta);
        inventario = inventario.map(p => {
          let st = p.stock;
          const it = cart.find(c => c.productoId === p.id);
          if(it && st !== '' && st !== null) st = Math.max(0, Number(st) - it.cantidad);
          cart.forEach(c => (c.materiales || []).forEach(m => {
            if(m.productoId === p.id && st !== '' && st !== null) st = Math.max(0, Number(st) - m.cantidad * c.cantidad);
          }));
          return st === p.stock ? p : { ...p, stock: st };
        });
        save('cuentas_ventas', ventas);
        save('cuentas_inventario', inventario);
        ov.remove();
        renderList();
        openVentaSavedConfirm(venta.id);
      });
    }
  }

  function openVentaSavedConfirm(id){
    const v = ventas.find(x => x.id === id);
    if(!v) return;
    openOverlay(`
      <div class="sheet-handle"></div>
      <h2>Venta registrada</h2>
      <div class="step-note">Cliente: ${escapeHtml(v.clienteNombre)} · ${fmtDate(v.fecha)}</div>
      <div class="totals-box" style="margin-top:0;">
        <div class="totals-row grand"><span>Total cobrado</span><span>${money(v.total)}</span></div>
      </div>
      <div class="ganancia-panel" style="margin-top:10px;">
        <div class="ganancia-toggle" style="cursor:default;">
          <span class="g-label">Ganancia de esta venta</span>
          <span class="g-value ${v.gananciaEstimada >= 0 ? 'pos' : 'neg'}">${money(v.gananciaEstimada)}</span>
        </div>
      </div>
      <p style="color:var(--ink-soft); font-size:13.5px; line-height:1.5; margin:14px 2px 0;">La factura es opcional — puedes generarla ahora para enviársela al cliente, o hacerlo más tarde desde esta misma venta.</p>
      <div class="sheet-actions" style="margin-top:16px;">
        <button class="btn btn-secondary" id="laterBtn">Listo, sin factura</button>

    `, (overlay) => {
      overlay.querySelector('#laterBtn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#genBtn').addEventListener('click', () => {
        overlay.remove();
        generarFactura(v.id);
      });
    });
  }

  function generarFactura(id){
    const idx = ventas.findIndex(x => x.id === id);
    if(idx === -1) return;
    if(!ventas[idx].folio){
      ventas[idx] = { ...ventas[idx], folio: config.siguienteFolio };
      config.siguienteFolio += 1;
      save('cuentas_ventas', ventas);
      save('cuentas_config', config);
      renderList();
    }
    openVentaDetail(id);
  }

  // ============================================================
  // FACTURAS — lista separada, detalle y edición
  // ============================================================
  function renderFacturas(){
    const term = searchInput.value.trim().toLowerCase();
    const items = ventas
      .filter(v => v.folio)
      .filter(v => v.clienteNombre.toLowerCase().includes(term) || ('f' + v.folio).includes(term) || String(v.folio).padStart(4,'0').includes(term))
      .sort((a,b) => b.folio - a.folio);
    const pendientes = ventas.filter(v => !v.folio).length;
    const banner = pendientes > 0
      ? `<div class="summary-card" style="margin-bottom:14px;"><div class="label">Ventas sin factura</div><div class="value" style="font-size:14px;">${pendientes} · toca + para facturar una</div></div>`
      : '';
    const hayFacturas = ventas.some(v => v.folio);
    if(items.length === 0){
      listWrap.innerHTML = banner + emptyState(
        hayFacturas ? 'Sin resultados' : 'Aún no tienes facturas',
        hayFacturas ? 'Prueba con otro nombre o folio.' : 'Toca + para generar una factura a partir de una venta registrada.'
      );
      return;
    }
    listWrap.innerHTML = banner + '<ul class="list">' + items.map(v => `
      <li class="row" data-id="${v.id}">
        <div class="row-main">
          <div class="row-title">F-${String(v.folio).padStart(4,'0')} · ${escapeHtml(v.clienteNombre)}</div>
          <div class="row-sub">${fmtDate(v.fecha)}</div>
        </div>
        <div class="row-value">${money(v.total)}</div>
      </li>`).join('') + '</ul>';
    listWrap.querySelectorAll('.row').forEach(row => row.addEventListener('click', () => openVentaDetail(row.getAttribute('data-id'))));
  }

  function openSinFacturaPicker(){
    const pendientes = ventas
      .filter(v => !v.folio)
      .sort((a,b) => b.fecha.localeCompare(a.fecha) || (b.creadoTs||0) - (a.creadoTs||0));
    if(pendientes.length === 0){
      openOverlay(`
        <div class="sheet-handle"></div>
        <h2>Sin ventas pendientes</h2>
        <p style="color:var(--ink-soft); font-size:14px; line-height:1.5;">Todas tus ventas ya tienen factura. Registra una venta nueva desde la pestaña Ventas.</p>
        <div class="sheet-actions"><button class="btn btn-primary" id="okBtn" style="flex:1;">Entendido</button></div>
      `, (ov) => ov.querySelector('#okBtn').addEventListener('click', () => ov.remove()));
      return;

    openOverlay(`
      <div class="sheet-handle"></div>
      <h2>Generar factura</h2>

        ${pendientes.map(v => `<div class="pick-row" data-id="${v.id}"><span class="name">${escapeHtml(v.clienteNombre)} · ${fmtDate(v.fecha)}</span><span class="meta">${money(v.total)}</span></div>`).join('')}

    `, (overlay) => {

        overlay.remove();
        generarFactura(row.getAttribute('data-id'));

  function buildInvoiceHtml(v){
    const color = config.colorFactura || '#1E4FA0';
    const logoBlock = config.logo
      ? `<img class="inv-logo" src="${config.logo}" alt="">`
      : `<div class="inv-logo-placeholder" style="background:${color};">${escapeHtml(initials(config.nombre))}</div>`;
    const bizMetaLines = [
      config.mostrarDireccion !== false ? config.direccion : '',
      config.mostrarTelefono !== false ? config.telefono : '',
      config.mostrarEmail !== false ? config.email : '',
    ].filter(Boolean).map(escapeHtml).join('<br>');
    const clienteMetaLines = [v.clienteDireccion, v.clienteTelefono, v.clienteEmail].filter(Boolean).map(escapeHtml).join('<br>');
    const medioNombre = { efectivo: 'Efectivo', tarjeta: 'Tarjeta', credito: 'A crédito', mixto: 'Mixto' };
    const on = k => config[k] !== false;
    const onOpt = k => config[k] === true;
    const descItem = it => it.caracteristicas || ((inventario.find(x => x.id === it.productoId) || {}).descripcion) || '';
    const fotosBox = (() => {
      if(!onOpt('mostrarFotos')) return '';
      const fs = v.items.map(it => { const pr = inventario.find(x => x.id === it.productoId); const src = it.foto || (pr && pr.foto); return src ? { src, nombre: it.nombre } : null; }).filter(Boolean);
      if(!fs.length) return '';
      return `<div class="inv-fotos">${fs.map(x => `<figure><img src="${x.src}" alt=""><figcaption>${escapeHtml(x.nombre)}</figcaption></figure>`).join('')}</div>`;
    })();
    const mNW = n => money(n).replace(/([\d.,]+)$/, '<span class="nw">$1</span>');
    const saldo = v.fiado ? saldoVenta(v) : 0;
    const pagada = saldo <= 0;
    const abonos = (v.abonos || []).slice().sort((a,b) => (a.fecha || '').localeCompare(b.fecha || ''));
    const sumaProd = v.sumaItems !== undefined ? v.sumaItems : v.subtotal;
    const pagosHtml = abonos.length && on('mostrarPagos') ? `
        <div class="inv-section-title">Pagos recibidos</div>
        <table class="inv-table inv-pagos">
          <thead><tr><th>Fecha</th><th>Medio</th><th class="num">Monto</th></tr></thead>
          <tbody>${abonos.map(a => `<tr><td>${fmtDate(a.fecha)}</td><td>${medioNombre[a.metodo] || '—'}</td><td class="num">${mNW(a.monto)}</td></tr>`).join('')}</tbody>
        </table>` : '';
    return `
      <div class="invoice-doc" style="--inv-color:${color};">
        <div class="inv-header">
          <div class="inv-biz">
            ${logoBlock}
            <div>
              <div class="inv-biz-name">${escapeHtml(config.nombre)}</div>
              <div class="inv-biz-meta">${bizMetaLines}</div>
            </div>

  function cargarLibsPDF(){
    if(window.jspdf && window.html2canvas) return Promise.resolve();
    const añadir = (src) => new Promise((ok, fail) => {
      const sc = document.createElement('script');
      sc.src = src;
      sc.onload = ok;
      sc.onerror = () => fail(new Error('No se pudo cargar el generador de PDF. Revisa tu conexión.'));
      document.head.appendChild(sc);
    });
    return añadir('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')
      .then(() => añadir('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'));
  }
  async function descargarArchivo(blob, nombre){
    try{
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if(dl){ await dl.save({ filename: nombre, data: blob }); return; }
    } catch(e){ /* sigue con el enlace normal */ }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }
  async function compartirFacturaPDF(v, overlay){
    const btn = overlay.querySelector('#pdfWaBtn');
    const textoBoton = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Preparando PDF…';
    const folio = String(v.folio).padStart(4,'0');
    const nombreArchivo = `${v.tipoDoc || 'Factura'}-${folio}.pdf`;
    try{
      await cargarLibsPDF();
      const nodo = document.createElement('div');
      nodo.style.cssText = 'position:fixed; left:-10000px; top:0; width:760px; background:#ffffff; padding:24px; box-sizing:border-box;';
      nodo.className = 'inv-pdf';
      nodo.innerHTML = buildInvoiceHtml(v);
      document.body.appendChild(nodo);
      let canvas;
      try { canvas = await window.html2canvas(nodo, { scale: 2, backgroundColor: '#ffffff' }); }
      finally { nodo.remove(); }
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4' });
      const margen = 8, anchoPag = 210, altoPag = 297;
      const imgW = anchoPag - margen * 2;
      const imgH = canvas.height * imgW / canvas.width;
      const altoUtil = altoPag - margen * 2;
      const imgData = canvas.toDataURL('image/jpeg', 0.92);
      for(let k = 0; k * altoUtil < imgH; k++){
        if(k > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', margen, margen - k * altoUtil, imgW, imgH);
      }
      const blob = pdf.output('blob');
      const archivo = new File([blob], nombreArchivo, { type: 'application/pdf' });
      const saldo = v.fiado ? saldoVenta(v) : 0;
      const texto = `Factura ${folio} de ${config.nombre}. Total: ${money(v.total)}${saldo > 0 ? '. Saldo pendiente: ' + money(saldo) : ''}.`;
      if(navigator.canShare && navigator.canShare({ files: [archivo] })){
        await navigator.share({ files: [archivo], title: nombreArchivo, text: texto });
        return;
      }
      await descargarArchivo(blob, nombreArchivo);
      const cli = clientes.find(c => c.id === v.clienteId);
      alert('Se descargó el PDF. Ábrelo y compártelo en WhatsApp. Ahora te abrimos el chat del cliente.');
      window.open(waUrl(cli ? cli.telefono : v.clienteTelefono, texto), '_blank');
    } catch(err){
      if(err && err.name === 'AbortError') return;
      alert('No pude preparar el PDF. ' + (err && err.message ? err.message : 'Intenta de nuevo.'));
    } finally {
      btn.disabled = false;
      btn.textContent = textoBoton;
    }
  }

  function resizeImageFile(file, maxSize, cb){
    const reader = new FileReader();
    reader.onerror = () => cb('');
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => cb('');
      img.onload = () => {
        let w = img.width, h = img.height;
        if(!w || !h){ cb(''); return; }
        if(w > h && w > maxSize){ h = Math.round(h * maxSize / w); w = maxSize; }
        else if(h > maxSize){ w = Math.round(w * maxSize / h); h = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        cb(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

    const input = overlay.querySelector('#' + prefix + 'Input');

    input.addEventListener('change', () => {

      input.value = '';
      if(!file) return;
      if(file.size > 15 * 1024 * 1024){ alert('La imagen es muy pesada. Elige una de menos de 15 MB.'); return; }
      resizeImageFile(file, maxSize, (dataUrl) => {
        if(!dataUrl){ alert('No pude leer esa imagen. Prueba con una foto en JPG o PNG.'); return; }
        onChange(dataUrl);
        preview.innerHTML = `<img class="logo-preview" src="${dataUrl}">`;

    removeBtn.addEventListener('click', () => {
      onChange('');

      removeBtn.style.display = 'none';
    });
  }

  function anularVenta(id){
    const v = ventas.find(x => x.id === id);
    if(!v) return;
    const unidades = (v.items||[]).reduce((s,it) => s + (Number(it.cantidad)||0), 0);
    openOverlay(`
      <div class="sheet-handle"></div>
      <h2>Anular venta</h2>
      <div class="step-note">${escapeHtml(v.clienteNombre)} · ${money(v.total)} · ${fmtDate(v.fecha)}</div>
      <p style="font-size:14px; line-height:1.5;">Se quitará la venta del historial y de los créditos. ${unidades} unidad(es) volverán al inventario${v.folio ? ` y la factura F-${String(v.folio).padStart(4,'0')} quedará anulada` : ''}. Esta acción no se puede deshacer.</p>
      <div class="sheet-actions">
        <button class="btn btn-secondary" id="anNo">No, cancelar</button>
        <button class="btn btn-primary" id="anSi" style="background:var(--danger);">Sí, anular</button>
      </div>
    `, (ov) => {
      ov.querySelector('#anNo').addEventListener('click', () => ov.remove());
      ov.querySelector('#anSi').addEventListener('click', () => {
        (v.items||[]).forEach(it => {
          const cant = Number(it.cantidad) || 0;
          (it.materiales || []).forEach(m => {
            const mp = inventario.find(x => x.id === m.productoId);
            if(!mp) return;
            const dev = (Number(m.cantidad) || 0) * cant;
            if(mp.stock !== '' && mp.stock !== null) inventario = inventario.map(x => x.id === mp.id ? { ...x, stock: Number(x.stock) + dev } : x);
            movimientos = [...movimientos, { id: uid(), tipo: 'devolucion', ts: Date.now(), productoId: mp.id, productoNombre: mp.nombre, cantidad: dev, motivo: `Venta anulada · ${v.clienteNombre}`, fecha: todayStr() }];
          });
          const p = inventario.find(x => x.id === it.productoId);
          if(!p) return;
          if(p.stock !== '' && p.stock !== null) inventario = inventario.map(x => x.id === p.id ? { ...x, stock: Number(x.stock) + cant } : x);
          movimientos = [...movimientos, { id: uid(), tipo: 'devolucion', ts: Date.now(), productoId: p.id, productoNombre: p.nombre, cantidad: cant, motivo: `Venta anulada · ${v.clienteNombre}`, fecha: todayStr() }];
        });
        ventas = ventas.filter(x => x.id !== v.id);
        save('cuentas_ventas', ventas);
        save('cuentas_inventario', inventario);
        save('cuentas_movimientos', movimientos);
        document.querySelectorAll('.overlay').forEach(o => o.remove());
        renderList();
      });
    });
  }
